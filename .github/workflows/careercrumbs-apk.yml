# Builds a CareerCrumbs test APK and attaches it to a pre-release so it can be downloaded on a phone.
name: CareerCrumbs test APK

on:
  push:
    branches: [claude/career-visibility-dev-app-etnuoc]
    paths: ["careercrumbs-cloud/**", ".github/workflows/careercrumbs-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: cd careercrumbs-cloud && npm test
      - name: Build APK
        run: bash careercrumbs-cloud/android/build.sh
        env:
          VERSION_CODE: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: careercrumbs-test-apk
          path: careercrumbs-cloud/android/build/careercrumbs-test.apk
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "careercrumbs-test-${{ github.run_number }}" \
            careercrumbs-cloud/android/build/careercrumbs-test.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "CareerCrumbs test build ${{ github.run_number }}" \
            --notes "Test build for sideloading. Not a store release."
