<title>CareerCrumbs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Track wins, numbers, team development and visibility on the way to your next promotion.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first single column with a bottom tab bar; a left rail from 900px.
   Look: warehouse signage — condensed caps headings, mono IDs like pick tickets,
   black / white / brown only (CareerCrumbs brand: no green). */
:root {
  --paper: #faf9f7;
  --surface: #ffffff;
  --sunk: #f2efeb;
  --ink: #17130f;
  --muted: #6b6158;
  --line: #e4ded7;
  --brown: #7a4a26;
  --brown-ink: #ffffff;
  --brown-soft: #f3e9e0;
  --bad: #a3341f;
  --bad-soft: #f8e6e1;
  --warn: #8a5c0c;
  --warn-soft: #f7eedb;
  --shadow: 0 1px 2px rgba(23, 19, 15, 0.06), 0 8px 24px rgba(23, 19, 15, 0.08);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121010;
    --surface: #1b1816;
    --sunk: #24201d;
    --ink: #f2eeea;
    --muted: #a79c92;
    --line: #322c27;
    --brown: #c8925f;
    --brown-ink: #1b1209;
    --brown-soft: #2c2219;
    --bad: #ea8a72;
    --bad-soft: #3a1f19;
    --warn: #e0b04f;
    --warn-soft: #33281a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121010;
  --surface: #1b1816;
  --sunk: #24201d;
  --ink: #f2eeea;
  --muted: #a79c92;
  --line: #322c27;
  --brown: #c8925f;
  --brown-ink: #1b1209;
  --brown-soft: #2c2219;
  --bad: #ea8a72;
  --bad-soft: #3a1f19;
  --warn: #e0b04f;
  --warn-soft: #33281a;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body {
  color: var(--ink);
  font: 400 16px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--paper);
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brown); }
:focus-visible { outline: 2px solid var(--brown); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: 2rem; text-transform: uppercase; letter-spacing: 0.01em; }
h2 { font-size: 1.35rem; text-transform: uppercase; letter-spacing: 0.02em; }
h3 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.eyebrow {
  font: 600 0.72rem/1.2 var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

/* ---------- shell ---------- */
.app { display: grid; min-height: 100%; }
.rail { display: none; }
.main {
  min-width: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tabbar) + 32px + env(safe-area-inset-bottom, 0px));
}
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  padding-block: 12px;
  margin-bottom: 8px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font: 700 1.05rem/1 var(--display);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  text-decoration: none;
  color: var(--ink);
}
.brand-mark { width: 26px; height: 26px; flex: none; }
.topbar .sync { margin-left: auto; }
.sync {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 500 0.72rem/1 var(--mono);
  color: var(--muted);
  white-space: nowrap;
}
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-s="saved"] i { background: var(--brown); }
.sync[data-s="saving"] i { background: var(--warn); }
.sync[data-s="error"] i, .sync[data-s="example"] i { background: var(--bad); }
.view { display: grid; gap: 20px; max-width: 880px; margin: 0 auto; padding-top: 8px; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.view-head > div { min-width: 0; display: grid; gap: 4px; }

.tabbar {
  position: fixed;
  inset: auto 0 0;
  z-index: 25;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding-left: max(4px, env(safe-area-inset-left, 0px));
  padding-right: max(4px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface);
  border-top: 1px solid var(--line);
}
.tab {
  display: grid;
  justify-items: center;
  gap: 2px;
  height: var(--tabbar);
  padding-top: 10px;
  border: 0;
  background: none;
  color: var(--muted);
  font: 600 0.7rem/1 var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  text-decoration: none;
  cursor: pointer;
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--brown); }
.tab[aria-current="page"] svg { stroke-width: 2.4; }

@media (min-width: 900px) {
  .app { grid-template-columns: 232px minmax(0, 1fr); }
  .tabbar { display: none; }
  .rail {
    display: flex;
    flex-direction: column;
    gap: 2px;
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 20px 12px;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    border-right: 1px solid var(--line);
    background: var(--surface);
    overflow-y: auto;
  }
  .rail .brand { padding: 4px 10px 18px; }
  .rail a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
  }
  .rail a svg { width: 19px; height: 19px; color: var(--muted); }
  .rail a:hover { background: var(--sunk); }
  .rail a[aria-current="page"] { background: var(--brown-soft); color: var(--brown); }
  .rail a[aria-current="page"] svg { color: var(--brown); }
  .rail .rail-sep { margin: 12px 10px 6px; }
  .rail .sync { margin: auto 10px 0; padding-top: 16px; }
  .main { padding-bottom: 48px; }
  .topbar .brand, .topbar .sync { display: none; }
}

/* ---------- primitives ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px;
  min-width: 0;
}
.card.flat { box-shadow: none; }
.stack { display: grid; gap: 12px; min-width: 0; }
.stack-s { display: grid; gap: 6px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.row.between { justify-content: space-between; }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; }
.tile b { font: 600 1.6rem/1.1 var(--mono); font-variant-numeric: tabular-nums; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 42px;
  padding: 0 16px;
  border-radius: 8px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
}
.btn svg { width: 18px; height: 18px; }
.btn.brown { background: var(--brown); border-color: var(--brown); color: var(--brown-ink); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--muted); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 0.875rem; }
.btn:disabled { opacity: 0.5; cursor: default; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--brown); font-weight: 600; cursor: pointer; text-align: left; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; display: inline-grid; place-items: center; cursor: pointer; color: var(--muted); }
.iconbtn svg { width: 18px; height: 18px; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font: 600 0.72rem/1.5 var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background: var(--sunk);
  color: var(--muted);
  white-space: nowrap;
}
.pill.brown { background: var(--brown-soft); color: var(--brown); }
.pill.solid { background: var(--brown); color: var(--brown-ink); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ink { background: var(--ink); color: var(--paper); }

.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  scroll-snap-align: start;
  min-height: 36px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-weight: 600;
  font-size: 0.875rem;
  cursor: pointer;
  white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .n { font-family: var(--mono); opacity: 0.7; margin-left: 4px; }

.input, .select, .textarea {
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
}
.textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--brown); box-shadow: 0 0 0 3px var(--brown-soft); }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-weight: 600; font-size: 0.9rem; }
.field > small { color: var(--muted); font-size: 0.8rem; }
.fields2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--brown); }
.togglechips { display: flex; flex-wrap: wrap; gap: 6px; }
.togglechips label { position: relative; }
.togglechips input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.togglechips span {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font-size: 0.85rem;
  font-weight: 500;
  background: var(--surface);
}
.togglechips input:checked + span { background: var(--brown); border-color: var(--brown); color: var(--brown-ink); }
.togglechips input:focus-visible + span { outline: 2px solid var(--brown); outline-offset: 2px; }

.empty {
  display: grid;
  justify-items: start;
  gap: 10px;
  padding: 24px 16px;
  border: 1px dashed var(--line);
  border-radius: var(--r);
  color: var(--muted);
}
.empty b { color: var(--ink); font-family: var(--display); font-size: 1.2rem; text-transform: uppercase; }

.banner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 16px;
  padding: 14px 16px;
  border-radius: var(--r);
  background: var(--ink);
  color: var(--paper);
}
.banner p { flex: 1 1 240px; min-width: 0; }
.banner .btn { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.banner .btn.ghost { background: transparent; color: var(--paper); border-color: rgba(255, 255, 255, 0.35); }
:root[data-theme="dark"] .banner .btn.ghost { border-color: rgba(0, 0, 0, 0.35); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .banner .btn.ghost { border-color: rgba(0, 0, 0, 0.35); } }

/* ---------- readiness meter (pallet-fill segments) ---------- */
.ready { display: grid; gap: 14px; }
.ready-top { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ready-pct { font: 700 3.4rem/0.9 var(--display); letter-spacing: -0.01em; }
.ready-pct small { font-size: 1.4rem; }
.segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.seg { height: 26px; border-radius: 3px; background: var(--sunk); position: relative; overflow: hidden; border: 1px solid var(--line); }
.seg i { position: absolute; inset: auto 0 0; background: var(--brown); }
.seg.met i { background: var(--ink); }
.seg-key { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--muted); }
.seg-key span { display: inline-flex; align-items: center; gap: 6px; }
.seg-key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* ---------- agenda ---------- */
.agenda { display: grid; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.agenda button {
  display: grid;
  grid-template-columns: 6px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 12px 14px 12px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  text-align: left;
  cursor: pointer;
}
.agenda button:last-child { border-bottom: 0; }
.agenda button:hover { background: var(--sunk); }
.agenda .bar { align-self: stretch; background: var(--line); }
.agenda .bad .bar { background: var(--bad); }
.agenda .warn .bar { background: var(--warn); }
.agenda b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.agenda small { color: var(--muted); display: block; overflow-wrap: anywhere; }
.agenda svg { width: 18px; height: 18px; color: var(--muted); }

/* ---------- win tickets ---------- */
.ticket {
  position: relative;
  display: grid;
  gap: 8px;
  padding: 14px 16px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  min-width: 0;
}
.ticket-head { display: flex; justify-content: space-between; gap: 8px; font: 500 0.75rem/1.2 var(--mono); color: var(--muted); letter-spacing: 0.04em; }
.ticket-head b { color: var(--brown); font-weight: 600; }
.ticket h3 { overflow-wrap: anywhere; }
.ticket .result { overflow-wrap: anywhere; }
.ticket .metric {
  font: 500 0.85rem/1.4 var(--mono);
  background: var(--sunk);
  border-radius: 6px;
  padding: 6px 8px;
  overflow-wrap: anywhere;
}
.ticket .tear { border-top: 1px dashed var(--line); margin: 2px -16px 0; }
.ticket .acts { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- KPI cards ---------- */
.kpi { display: grid; gap: 8px; cursor: pointer; text-align: left; width: 100%; }
.kpi:hover { border-color: var(--muted); }
.kpi-val { font: 600 1.9rem/1 var(--mono); font-variant-numeric: tabular-nums; }
.kpi-val small { font-size: 0.9rem; color: var(--muted); font-weight: 500; }
.spark { width: 100%; height: 56px; display: block; overflow: visible; }
.chart { width: 100%; height: auto; display: block; }
.trend-up { color: var(--brown); }
.trend-down { color: var(--bad); }

/* ---------- competency rows ---------- */
.comp { display: grid; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.comp:last-child { border-bottom: 0; }
.rating { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.rating button {
  min-height: 38px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 6px;
  font: 600 0.8rem/1 var(--mono);
  cursor: pointer;
  position: relative;
}
.rating button[aria-pressed="true"] { background: var(--brown); border-color: var(--brown); color: var(--brown-ink); }
.rating button.target::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -6px;
  width: 6px;
  height: 6px;
  margin-left: -3px;
  background: var(--ink);
  transform: rotate(45deg);
}
.plan-phase { display: grid; gap: 8px; }
.plan-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.plan-item:last-child { border-bottom: 0; }
.plan-item.done .t { text-decoration: line-through; color: var(--muted); }
.plan-item .t { overflow-wrap: anywhere; }

/* ---------- matrix ---------- */
.scroll-x { overflow-x: auto; max-width: 100%; }
table.matrix { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 0.85rem; }
.matrix th, .matrix td { padding: 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.matrix th:first-child, .matrix td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
.matrix thead th { font: 600 0.7rem/1.2 var(--mono); text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.lvl {
  width: 40px;
  height: 32px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  font: 600 0.72rem/1 var(--mono);
  cursor: pointer;
  color: var(--muted);
}
.lvl[data-l="1"] { background: var(--brown-soft); color: var(--brown); border-color: var(--brown-soft); }
.lvl[data-l="2"] { background: var(--brown); color: var(--brown-ink); border-color: var(--brown); }
.lvl[data-l="3"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.matrix tfoot td { font: 600 0.8rem/1 var(--mono); border-bottom: 0; }

/* ---------- lists ---------- */
.list { display: grid; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.li { display: grid; gap: 4px; padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; cursor: pointer; min-width: 0; }
.li:last-child { border-bottom: 0; }
.li:hover { background: var(--sunk); }
.li b { overflow-wrap: anywhere; }
.timeline { display: grid; gap: 0; border-left: 2px solid var(--line); margin-left: 6px; }
.timeline > div { position: relative; padding: 0 0 12px 16px; overflow-wrap: anywhere; }
.timeline > div::before { content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--brown); }
.progress { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--brown); }
.ms { display: grid; gap: 4px; }
.ms label { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; }
.ms input { accent-color: var(--brown); width: 18px; height: 18px; flex: none; }

/* ---------- sheet ---------- */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(10, 8, 6, 0.5);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet {
  width: 100%;
  max-width: 640px;
  max-height: calc(100% - 40px - env(safe-area-inset-top, 0px));
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  box-shadow: var(--shadow);
}
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 12px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.sheet form, .sheet .sheet-body { display: grid; gap: 14px; }
.sheet-foot {
  position: sticky;
  bottom: calc(-20px - env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
  margin-bottom: calc(-20px - env(safe-area-inset-bottom, 0px));
  background: var(--surface);
  border-top: 1px solid var(--line);
}
.sheet-foot .grow { flex: 1; }
@media (min-width: 700px) {
  .scrim { align-items: center; }
  .sheet { border-radius: 16px; max-height: 88vh; }
  .sheet-grip { display: none; }
}
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); }
.confirm p { flex: 1 1 180px; }
.out { white-space: pre-wrap; font: 0.88rem/1.5 var(--mono); background: var(--sunk); padding: 12px; border-radius: 8px; max-height: 50vh; overflow: auto; overflow-wrap: anywhere; }
.ai-note { font: 500 0.75rem/1.3 var(--mono); color: var(--brown); text-transform: uppercase; letter-spacing: 0.05em; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tabbar) + 16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: calc(100% - 32px);
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--ink);
  color: var(--paper);
  box-shadow: var(--shadow);
  font-weight: 500;
}

@media (min-width: 900px) { .toast { bottom: 24px; } }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise 0.18s ease-out; }
  .toast { animation: rise 0.18s ease-out; }
  @keyframes rise { from { transform: translateY(12px); opacity: 0.6; } }
  .toast { animation-name: toastrise; }
  @keyframes toastrise { from { transform: translate(-50%, 12px); opacity: 0.6; } }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.loading { padding: 48px 0; display: grid; gap: 8px; justify-items: center; color: var(--muted); }

</style>
<div id="app" class="app"><div class="loading"><span>Opening CareerCrumbs…</span></div></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<script>
// CareerCrumbs pure helpers. No DOM, no storage: everything here is testable in Node.
(function (root) {
  "use strict";

  // ---------- ids & dates ----------
  const uid = (p) => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const today = (now) => iso(now || new Date());
  const parse = (s) => {
    const [y, m, d] = String(s).slice(0, 10).split("-").map(Number);
    return new Date(y, (m || 1) - 1, d || 1);
  };
  const addDays = (s, n) => {
    const d = parse(s);
    d.setDate(d.getDate() + n);
    return iso(d);
  };
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  // Monday of the week that holds `s`; KPI entries are keyed by this.
  const weekOf = (s) => {
    const d = parse(s);
    const back = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - back);
    return iso(d);
  };
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const fmtDate = (s) => {
    if (!s) return "";
    const d = parse(s);
    return MONTHS[d.getMonth()] + " " + d.getDate();
  };
  const fmtDateY = (s) => (s ? fmtDate(s) + ", " + parse(s).getFullYear() : "");
  const relDays = (s, now) => {
    const n = daysBetween(today(now), s);
    if (n === 0) return "today";
    if (n === 1) return "tomorrow";
    if (n === -1) return "yesterday";
    return n > 0 ? "in " + n + " days" : Math.abs(n) + " days ago";
  };

  // ---------- numbers ----------
  const num = (v) => {
    if (v === "" || v === null || v === undefined) return null;
    const n = Number(String(v).replace(/[,$%\s]/g, ""));
    return Number.isFinite(n) ? n : null;
  };
  const fmtNum = (n, unit) => {
    if (n === null || n === undefined || !Number.isFinite(n)) return "—";
    const r = Math.abs(n) >= 100 ? Math.round(n) : Math.round(n * 100) / 100;
    const s = r.toLocaleString("en-US");
    if (unit === "%") return s + "%";
    if (unit === "$") return (n < 0 ? "-$" : "$") + Math.abs(r).toLocaleString("en-US");
    return unit ? s + " " + unit : s;
  };

  // ---------- defaults ----------
  const COMPETENCY_PRESET = [
    ["Operational excellence", "Runs a safe, accurate, on-time building shift after shift."],
    ["People leadership", "Hires, coaches, recognises and holds the team accountable."],
    ["Data & metrics", "Reads the numbers, finds the cause, and acts on it."],
    ["Problem solving", "Gets to root cause and makes fixes stick."],
    ["Safety & compliance", "Food safety, audits, incident follow-through."],
    ["Planning & labor", "Builds schedules and labor plans that match volume."],
    ["Inventory & shrink", "Protects inventory accuracy and reduces loss."],
    ["Cross-team influence", "Moves work forward with people you don't manage."],
    ["Communication", "Clear updates up, down and across."],
    ["Change leadership", "Lands new processes and gets buy-in."],
  ];
  const RATING_LABELS = ["Not started", "Learning", "Developing", "Proficient", "Role model"];

  const KPI_PRESETS = [
    { name: "Units per hour (UPH)", unit: "UPH", better: "higher" },
    { name: "Pick accuracy", unit: "%", better: "higher" },
    { name: "Item-not-found (INF) rate", unit: "%", better: "lower" },
    { name: "Order pick time", unit: "min", better: "lower" },
    { name: "Dasher wait time", unit: "min", better: "lower" },
    { name: "On-time handoff", unit: "%", better: "higher" },
    { name: "Inventory record accuracy", unit: "%", better: "higher" },
    { name: "Shrink", unit: "$", better: "lower" },
    { name: "Labor hours per order", unit: "hrs", better: "lower" },
    { name: "Team attendance", unit: "%", better: "higher" },
    { name: "Safety incidents", unit: "", better: "lower" },
    { name: "Expired / out-of-date pulls", unit: "", better: "lower" },
  ];

  const STATIONS_PRESET = ["Receiving", "Putaway", "Picking", "Packing", "Dispatch", "Cycle counts", "Cold chain"];
  const TRAIN_LEVELS = ["—", "Training", "Certified", "Trainer"];
  const JOB_STATUSES = ["Saved", "Applied", "Interview", "Offer", "Closed"];
  const PROJECT_STATUSES = ["Idea", "Active", "Blocked", "Done"];
  const RELATIONS = ["Manager", "Skip-level", "Peer", "Mentor", "Cross-team", "HR / Recruiter"];
  const DRAFT_KINDS = {
    update: "Weekly update",
    case: "Promotion case",
    bullet: "Résumé bullets",
    oneonone: "1:1 agenda",
    brag: "Brag doc",
    other: "Other",
  };

  const emptyWorkspace = () => ({
    profile: {
      name: "",
      role: "Warehouse Supervisor",
      company: "DashMart",
      site: "",
      targetRole: "Operations Manager",
      targetDate: "",
      why: "",
    },
    wins: [],
    kpis: [],
    competencies: COMPETENCY_PRESET.map(([name, desc], i) => ({
      id: "c" + (i + 1),
      name,
      desc,
      rating: 0,
      target: 3,
      notes: "",
    })),
    plan: [],
    projects: [],
    team: [],
    stations: STATIONS_PRESET.slice(),
    people: [],
    jobs: [],
    drafts: [],
    reviews: [],
    winSeq: 0,
  });

  // Fill in anything missing so older saves and hand-edited imports still load.
  function normalize(ws) {
    const base = emptyWorkspace();
    const out = Object.assign({}, base, ws || {});
    out.profile = Object.assign({}, base.profile, (ws && ws.profile) || {});
    for (const k of ["wins", "kpis", "competencies", "plan", "projects", "team", "stations", "people", "jobs", "drafts", "reviews"]) {
      if (!Array.isArray(out[k])) out[k] = base[k];
    }
    out.kpis = out.kpis.map((k) => Object.assign({ entries: [], target: null, better: "higher", unit: "" }, k));
    out.team = out.team.map((m) => Object.assign({ notes: [], training: {} }, m));
    out.people = out.people.map((p) => Object.assign({ touches: [], cadenceDays: 14 }, p));
    out.jobs = out.jobs.map((j) => Object.assign({ history: [], status: "Saved" }, j));
    out.projects = out.projects.map((p) => Object.assign({ milestones: [], status: "Active" }, p));
    out.wins = out.wins.map((w) => Object.assign({ competencies: [], skills: [] }, w));
    out.winSeq = Math.max(Number(out.winSeq) || 0, out.wins.reduce((m, w) => Math.max(m, w.n || 0), 0));
    return out;
  }

  // ---------- wins → résumé bullets ----------
  const VERB_MAP = [
    [/^(led|lead|leading)\b/i, "Led"],
    [/^(train|trained|training|coach|coached|coaching)\b/i, "Trained"],
    [/^(reduce|reduced|cut|lower|lowered)\b/i, "Reduced"],
    [/^(improve|improved|raise|raised|increase|increased|boost|boosted)\b/i, "Improved"],
    [/^(build|built|create|created|set up|launch|launched)\b/i, "Built"],
    [/^(fix|fixed|solve|solved|resolve|resolved)\b/i, "Resolved"],
    [/^(redesign|redesigned|reorganize|reorganized|restructure|restructured)\b/i, "Redesigned"],
  ];
  const clean = (s) => String(s || "").trim().replace(/\s+/g, " ").replace(/[.\s]+$/, "");
  const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
  const lower1 = (s) => (s && !/^[A-Z]{2}/.test(s) ? s.charAt(0).toLowerCase() + s.slice(1) : s);

  function metricPhrase(m) {
    if (!m || !m.label) return "";
    const b = num(m.before);
    const a = num(m.after);
    if (b === null || a === null) return "";
    const unit = m.unit || "";
    let delta = "";
    if (b !== 0 && unit !== "%") delta = " (" + (a > b ? "+" : "") + Math.round(((a - b) / Math.abs(b)) * 100) + "%)";
    if (unit === "%") delta = " (" + (a > b ? "+" : "") + Math.round((a - b) * 10) / 10 + " pts)";
    return m.label + " from " + fmtNum(b, unit) + " to " + fmtNum(a, unit) + delta;
  }

  // Template only. Uses the person's own words and numbers; never invents a figure.
  function bulletFromWin(w) {
    let action = clean(w.action) || clean(w.title);
    if (!action) action = "[what you did]";
    let lead = "";
    for (const [re, verb] of VERB_MAP) {
      if (re.test(action)) {
        lead = verb;
        action = action.replace(re, "").trim();
        break;
      }
    }
    let text = lead ? lead + " " + lower1(action) : cap(action);
    const metric = metricPhrase(w.metric);
    const result = clean(w.result);
    if (metric && result) text += ", moving " + metric + "; " + lower1(result);
    else if (metric) text += ", moving " + metric;
    else if (result) text += ", resulting in " + lower1(result);
    else text += ", resulting in [result — add a number if you have one]";
    return text.replace(/\s+,/g, ",") + ".";
  }

  // ---------- promotion readiness ----------
  function readiness(ws) {
    const cs = ws.competencies || [];
    const totalTarget = cs.reduce((s, c) => s + (Number(c.target) || 0), 0);
    if (!totalTarget) return { pct: 0, atTarget: 0, total: cs.length, evidenced: 0, gaps: [] };
    const met = cs.reduce((s, c) => s + Math.min(Number(c.rating) || 0, Number(c.target) || 0), 0);
    const evidence = evidenceCounts(ws);
    const gaps = cs
      .map((c) => ({ c, gap: (Number(c.target) || 0) - (Number(c.rating) || 0), ev: evidence[c.id] || 0 }))
      .filter((g) => g.gap > 0 || g.ev === 0)
      .sort((a, b) => b.gap - a.gap || a.ev - b.ev);
    return {
      pct: Math.round((met / totalTarget) * 100),
      atTarget: cs.filter((c) => (Number(c.rating) || 0) >= (Number(c.target) || 0)).length,
      total: cs.length,
      evidenced: cs.filter((c) => evidence[c.id]).length,
      gaps,
    };
  }
  function evidenceCounts(ws) {
    const out = {};
    for (const w of ws.wins || []) for (const id of w.competencies || []) out[id] = (out[id] || 0) + 1;
    return out;
  }

  // ---------- KPIs ----------
  function kpiSeries(k, weeks, now) {
    const end = weekOf(today(now));
    const map = {};
    for (const e of k.entries || []) map[e.week] = num(e.value);
    const out = [];
    for (let i = weeks - 1; i >= 0; i--) {
      const wk = addDays(end, -7 * i);
      out.push({ week: wk, value: map[wk] === undefined ? null : map[wk] });
    }
    return out;
  }
  function kpiLatest(k) {
    const es = (k.entries || []).filter((e) => num(e.value) !== null).slice().sort((a, b) => (a.week < b.week ? 1 : -1));
    return { latest: es[0] || null, prior: es[1] || null };
  }
  function kpiStatus(k) {
    const { latest, prior } = kpiLatest(k);
    const t = num(k.target);
    const v = latest ? num(latest.value) : null;
    let state = "none";
    if (v !== null && t !== null) {
      const good = k.better === "lower" ? v <= t : v >= t;
      const near = k.better === "lower" ? v <= t * 1.05 : v >= t * 0.95;
      state = good ? "on" : near ? "near" : "off";
    } else if (v !== null) state = "logged";
    let trend = 0;
    if (latest && prior) {
      const d = num(latest.value) - num(prior.value);
      trend = d === 0 ? 0 : (d > 0) === (k.better !== "lower") ? 1 : -1;
    }
    return { state, value: v, target: t, trend, latest, prior };
  }
  // Points for an SVG sparkline; nulls break the line into segments.
  function sparkPoints(series, w, h, padY, target) {
    const vals = series.map((p) => p.value).filter((v) => v !== null);
    if (target !== null && target !== undefined) vals.push(target);
    if (!vals.length) return { segments: [], y: () => h / 2, min: 0, max: 0 };
    let min = Math.min.apply(null, vals);
    let max = Math.max.apply(null, vals);
    if (min === max) {
      min -= 1;
      max += 1;
    }
    const step = series.length > 1 ? w / (series.length - 1) : 0;
    const y = (v) => padY + (h - 2 * padY) * (1 - (v - min) / (max - min));
    const segments = [];
    let cur = [];
    series.forEach((p, i) => {
      if (p.value === null) {
        if (cur.length) segments.push(cur);
        cur = [];
      } else cur.push([Math.round(i * step * 10) / 10, Math.round(y(p.value) * 10) / 10]);
    });
    if (cur.length) segments.push(cur);
    return { segments, y, min, max };
  }

  // ---------- people & team ----------
  function lastTouch(p) {
    const ds = (p.touches || []).map((t) => t.date).concat(p.lastTouch ? [p.lastTouch] : []);
    return ds.sort().pop() || null;
  }
  function touchDue(p, now) {
    const last = lastTouch(p);
    const cadence = Number(p.cadenceDays) || 14;
    if (!last) return { due: true, days: null, label: "No touchpoint yet" };
    const since = daysBetween(last, today(now));
    const left = cadence - since;
    if (left < 0) return { due: true, days: left, label: "Overdue by " + Math.abs(left) + (left === -1 ? " day" : " days") };
    if (left === 0) return { due: true, days: 0, label: "Due today" };
    return { due: false, days: left, label: "Next in " + left + (left === 1 ? " day" : " days") };
  }
  function lastOneOnOne(m) {
    return (m.notes || []).filter((n) => n.type === "1:1").map((n) => n.date).sort().pop() || null;
  }
  function oneOnOneDue(m, now, every) {
    const last = lastOneOnOne(m);
    if (!last) return { due: true, label: "No 1:1 logged" };
    const since = daysBetween(last, today(now));
    const left = (every || 14) - since;
    return left <= 0
      ? { due: true, label: left === 0 ? "1:1 due today" : "1:1 overdue by " + -left + "d" }
      : { due: false, label: "Last 1:1 " + since + "d ago" };
  }
  // How many people are certified or trainer level per station.
  function coverage(ws) {
    const out = {};
    for (const s of ws.stations) out[s] = 0;
    for (const m of ws.team) for (const s of ws.stations) if ((m.training || {})[s] >= 2) out[s]++;
    return out;
  }

  // ---------- jobs ----------
  function setJobStatus(job, status, now) {
    const at = (now || new Date()).toISOString();
    const next = Object.assign({}, job, { status, updated: at });
    next.history = (job.history || []).concat([{ status, at }]);
    if (status === "Applied" && !job.appliedAt) next.appliedAt = at.slice(0, 10);
    return next;
  }
  function followUpBadge(job, now) {
    if (!job.followUpAt || job.status === "Closed") return null;
    const n = daysBetween(today(now), job.followUpAt);
    if (n < 0) return { tone: "bad", text: "Follow-up overdue by " + -n + (n === -1 ? " day" : " days") };
    if (n === 0) return { tone: "warn", text: "Follow up today" };
    return { tone: "", text: "Follow up " + relDays(job.followUpAt, now) };
  }

  // ---------- documents (templates) ----------
  const bullets = (arr) => arr.map((s) => "- " + s).join("\n");
  function winLine(w) {
    const m = metricPhrase(w.metric);
    return clean(w.title) + (m ? " — " + m : clean(w.result) ? " — " + clean(w.result) : "") + " (" + fmtDate(w.date) + ")";
  }
  function inRange(d, from, to) {
    return d && d >= from && d <= to;
  }

  function weeklyUpdate(ws, now) {
    const end = today(now);
    const start = addDays(end, -6);
    const p = ws.profile;
    const wins = ws.wins.filter((w) => inRange(w.date, start, end));
    const lines = ["Weekly update — " + fmtDate(start) + " to " + fmtDateY(end), ""];
    lines.push("Hi" + (managerName(ws) ? " " + managerName(ws) : "") + ", here's my week" + (p.site ? " at " + p.site : "") + ".", "");
    lines.push("WINS");
    lines.push(wins.length ? bullets(wins.map(winLine)) : "- [Add this week's wins in CareerCrumbs]");
    const k = ws.kpis.map((x) => ({ x, s: kpiStatus(x) })).filter((o) => o.s.latest && o.s.latest.week >= weekOf(start));
    if (k.length) {
      lines.push("", "NUMBERS");
      lines.push(
        bullets(
          k.map(({ x, s }) => {
            let t = x.name + ": " + fmtNum(s.value, x.unit);
            if (s.target !== null) t += " (target " + fmtNum(s.target, x.unit) + (s.state === "on" ? ", on target" : "") + ")";
            if (s.prior) t += ", " + (s.trend > 0 ? "better than" : s.trend < 0 ? "behind" : "same as") + " last week";
            return t;
          })
        )
      );
    }
    const active = ws.projects.filter((x) => x.status === "Active" || x.status === "Blocked");
    if (active.length) {
      lines.push("", "PROJECTS");
      lines.push(bullets(active.map((x) => x.title + " — " + x.status.toLowerCase() + (x.nextAction ? "; next: " + clean(x.nextAction) : ""))));
    }
    const blocked = ws.projects.filter((x) => x.status === "Blocked");
    lines.push("", "WHERE I COULD USE HELP");
    lines.push(blocked.length ? bullets(blocked.map((x) => x.title + (x.blocker ? ": " + clean(x.blocker) : ""))) : "- [Anything you need from your manager]");
    lines.push("", "NEXT WEEK");
    lines.push("- [Your top 1–3 priorities]");
    return lines.join("\n");
  }
  function managerName(ws) {
    const m = ws.people.find((x) => x.relation === "Manager");
    return m ? m.name.split(" ")[0] : "";
  }

  function promotionCase(ws) {
    const p = ws.profile;
    const ev = {};
    for (const w of ws.wins) for (const id of w.competencies || []) (ev[id] = ev[id] || []).push(w);
    const r = readiness(ws);
    const L = [];
    L.push("Promotion case: " + (p.name || "[Your name]") + " — " + p.role + " → " + p.targetRole, "");
    L.push("SUMMARY");
    L.push(
      "I'm a " + p.role + (p.company ? " at " + p.company : "") + (p.site ? " (" + p.site + ")" : "") + ". I'm working toward " + p.targetRole + (p.targetDate ? " by " + fmtDateY(p.targetDate) : "") + "."
    );
    if (p.why) L.push(clean(p.why) + ".");
    L.push("Self-assessed readiness: " + r.pct + "% across " + r.total + " competencies; " + r.evidenced + " have documented evidence.", "");
    L.push("EVIDENCE BY COMPETENCY");
    for (const c of ws.competencies) {
      const list = (ev[c.id] || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 3);
      L.push("", c.name + " — " + RATING_LABELS[c.rating || 0] + " (target: " + RATING_LABELS[c.target || 0] + ")");
      L.push(list.length ? bullets(list.map(winLine)) : "- [Gap: log a win that shows this]");
    }
    const kp = ws.kpis.map((k) => ({ k, s: kpiStatus(k) })).filter((o) => o.s.latest);
    if (kp.length) {
      L.push("", "RESULTS I OWN");
      L.push(bullets(kp.map(({ k, s }) => k.name + ": " + fmtNum(s.value, k.unit) + (s.target !== null ? " vs target " + fmtNum(s.target, k.unit) : ""))));
    }
    const done = ws.projects.filter((x) => x.status === "Done");
    if (done.length) {
      L.push("", "PROJECTS DELIVERED");
      L.push(bullets(done.map((x) => x.title + (x.result ? " — " + clean(x.result) : ""))));
    }
    if (ws.team.length) {
      const cov = coverage(ws);
      const certified = Object.values(cov).reduce((a, b) => a + b, 0);
      L.push("", "DEVELOPING MY TEAM");
      L.push("- Team of " + ws.team.length + "; " + certified + " station certifications across " + ws.stations.length + " stations.");
      const rec = ws.team.reduce((s, m) => s + (m.notes || []).filter((n) => n.type === "Recognition").length, 0);
      if (rec) L.push("- " + rec + " recognitions given and logged.");
    }
    L.push("", "WHAT I'M ASKING FOR");
    L.push("- [The role, the timeline, and the support you need]");
    return L.join("\n");
  }

  function oneOnOneAgenda(m, ws, now) {
    const notes = (m.notes || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    const last = notes.find((n) => n.type === "1:1");
    const L = ["1:1 with " + m.name + " — " + fmtDateY(today(now)), ""];
    L.push("CHECK-IN", "- How are you doing, honestly? Anything getting in the way?", "");
    L.push("FOLLOW-UPS FROM LAST TIME");
    L.push(last ? "- " + clean(last.text) + " (" + fmtDate(last.date) + ")" : "- [First logged 1:1]");
    L.push("", "RECOGNITION");

        local = JSON.parse(localStorage.getItem(LS_KEY) || "null");

  }

  async function startWorkspace(keepExamples) {
    const prev = ws;
    ws = keepExamples ? C.normalize(prev) : C.emptyWorkspace();
    if (keepExamples) ws.profile.site = "";
    mode = db ? "cloud" : "local";
    warnedExample = false;
    closeSheet();
    render();
    await saveAllNow();
    toast(keepExamples ? "Workspace started from the examples. Rename or delete them anytime." : "Your workspace is ready. Start by filling in your profile.");
    if (!keepExamples) go("backup");
  }

  // ---------- routing ----------
  function onHash(initial) {
    const h = (location.hash || "").replace(/^#/, "");
    const next = NAV.some(([r]) => r === h) ? h : "home";
    if (next !== route || initial === true) {
      route = next;
      if (initial !== true) {
        render();
        window.scrollTo(0, 0);
      }
    }
  }
  function go(r) {
    if (location.hash === "#" + r) onHash();
    else location.hash = r;
  }

  // ---------- render ----------
  function render() {
    const app = $("#app");
    if (!app) return;
    const navLinks = NAV.map(([r, l], i) => (i === 4 ? '<div class="eyebrow rail-sep">Lead &amp; grow</div>' : "") + '<a href="#' + r + '"' + (route === r ? ' aria-current="page"' : "") + ">" + icon(r) + esc(l) + "</a>").join("");
    const tabs =
      TABS.map((r) => {
        const l = NAV.find((n) => n[0] === r)[1];
        return '<a class="tab" href="#' + r + '"' + (route === r ? ' aria-current="page"' : "") + ">" + icon(r) + "<span>" + esc(l) + "</span></a>";
      }).join("") +
      '<button class="tab" type="button" data-act="more"' + (TABS.includes(route) ? "" : ' aria-current="page"') + ">" + icon("more") + "<span>More</span></button>";
    const title = (NAV.find((n) => n[0] === route) || ["", ""])[1];
    const body = mode === "loading" ? '<div class="loading">' + MARK + "<span>Opening your workspace…</span></div>" : VIEWS[route]();
    const scrollY = window.scrollY;
    app.innerHTML =
      '<nav class="rail" aria-label="Sections"><a class="brand" href="#home">' + MARK + "CareerCrumbs</a>" + navLinks + '<span class="sync"></span></nav>' +
      '<main class="main"><header class="topbar"><a class="brand" href="#home">' + MARK + '<span class="sr">CareerCrumbs</span></a><span class="eyebrow">' + esc(title) + '</span><span class="sync"></span></header>' +
      (mode === "example" ? exampleBanner() : "") + body + "</main>" +
      '<nav class="tabbar" aria-label="Main">' + tabs + "</nav>";
    window.scrollTo(0, scrollY);
    setSync(syncState);
  }
  function exampleBanner() {
    return '<div class="view" style="padding-top:0;margin-bottom:12px"><div class="banner"><p><b>You\'re looking at example data.</b> It shows how a supervisor might use CareerCrumbs. Nothing is saved until you start your own workspace.</p><div class="row"><button class="btn sm" data-act="start-blank">Start fresh</button><button class="btn sm ghost" data-act="start-keep">Keep examples</button></div></div></div>';
  }
  const head = (eyebrow, title, right) => '<div class="view-head"><div><span class="eyebrow">' + esc(eyebrow) + "</span><h1>" + esc(title) + "</h1></div>" + (right ? '<div class="row">' + right + "</div>" : "") + "</div>";

  // ---------- HOME ----------
  function readinessCard(compact) {
    const r = C.readiness(ws);
    const p = ws.profile;
    const weeksLeft = p.targetDate ? Math.max(0, Math.ceil(C.daysBetween(t0(), p.targetDate) / 7)) : null;
    const segs = ws.competencies
      .map((c) => {
        const tg = Number(c.target) || 1;
        const pct = Math.min(100, Math.round(((Number(c.rating) || 0) / tg) * 100));
        return '<div class="seg' + (pct >= 100 ? " met" : "") + '" title="' + esc(c.name + ": " + C.RATING_LABELS[c.rating || 0]) + '"><i style="height:' + pct + '%"></i></div>';
      })
      .join("");
    return (
      '<section class="card ready" aria-label="Promotion readiness"><div class="ready-top"><div class="stack-s"><span class="eyebrow">Ready for ' + esc(p.targetRole || "your next role") + '</span><div class="ready-pct mono">' + r.pct + '<small>%</small></div></div><div class="stack-s" style="text-align:right">' +
      (weeksLeft !== null ? '<span class="mono"><b>' + weeksLeft + "</b> weeks</span><span class=\"muted small\">to " + esc(C.fmtDateY(p.targetDate)) + "</span>" : '<button class="linkbtn" data-act="edit-profile">Set a target date</button>') +
      '</div></div><div class="segs" role="img" aria-label="' + r.atTarget + " of " + r.total + ' competencies at target">' + segs + "</div>" +
      '<div class="seg-key"><span><i style="background:var(--ink)"></i>' + r.atTarget + " of " + r.total + ' at target</span><span><i style="background:var(--brown)"></i>Working on it</span><span>' + r.evidenced + " with evidence</span></div>" +
      (compact ? '<div class="row"><a class="btn sm ghost" href="#path">Open promotion path ' + icon("chev") + "</a></div>" : "") +
      "</section>"
    );
  }
  function winsRhythm() {
    const data = C.winsByWeek(ws, 12);
    const max = Math.max(2, ...data.map((d) => d.count));
    const W = 320, H = 80, bw = W / data.length;
    const bars = data
      .map((d, i) => {
        const h = Math.round((d.count / max) * (H - 18));
        return '<rect x="' + (i * bw + 3).toFixed(1) + '" y="' + (H - 14 - h) + '" width="' + (bw - 6).toFixed(1) + '" height="' + Math.max(h, d.count ? 2 : 1) + '" rx="2" fill="' + (i === data.length - 1 ? "var(--brown)" : d.count ? "var(--ink)" : "var(--line)") + '"><title>' + d.count + " wins, week of " + C.fmtDate(d.week) + "</title></rect>";
      })
      .join("");
    const labels = [0, 4, 8, 11].map((i) => '<text x="' + (i === 0 ? 2 : i === 11 ? W - 2 : i * bw + bw / 2).toFixed(1) + '" y="' + (H - 2) + '" text-anchor="' + (i === 0 ? "start" : i === 11 ? "end" : "middle") + '" font-size="9" font-family="var(--mono)" fill="var(--muted)">' + C.fmtDate(data[i].week) + "</text>").join("");
    return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Wins logged per week, last 12 weeks">' + bars + labels + "</svg>";
  }
  const VIEWS = {};
  VIEWS.home = function () {
    const p = ws.profile;
    const items = C.agenda(ws).slice(0, 8);
    const st = C.weekStats(ws);
    const recent = sortDesc(ws.wins, "date").slice(0, 3);
    const line = st.wins7 ? "Logged " + plural(st.wins7, "win") + " this week. That's the habit that gets people promoted." : "A win from this week, even a small one, is worth two minutes.";
    return (
      '<div class="view">' +
      head(C.fmtDateY(t0()) + (p.site ? " · " + p.site : ""), greeting() + (p.name ? ", " + p.name.split(" ")[0] : "")) +
      '<div class="row"><button class="btn brown" data-act="new-win">' + icon("plus") + 'Log a win</button><button class="btn ghost" data-act="log-week">Log numbers</button><button class="btn ghost" data-act="gen-update">Weekly update</button></div>' +
      readinessCard(true) +
      '<section class="stack"><div class="row between"><h2>Today</h2><span class="muted small">' + plural(items.length, "item") + "</span></div>" +
      (items.length
        ? '<div class="agenda">' + items.map((it) => '<button class="' + it.tone + '" data-act="goto" data-r="' + it.route + '"><span class="bar"></span><span><b>' + esc(it.title) + "</b><small>" + esc(it.sub) + "</small></span>" + icon("chev") + "</button>").join("") + "</div>"
        : '<div class="empty"><b>All clear</b><span>No follow-ups, overdue 1:1s or blocked projects. Good time to log a win or plan next week.</span></div>') +
      "</section>" +
      '<section class="stack"><h2>This week</h2><div class="tiles">' +
      '<div class="tile"><span class="eyebrow">Wins · 7d</span><b>' + st.wins7 + '</b></div><div class="tile"><span class="eyebrow">Wins · 30d</span><b>' + st.wins30 + "</b></div>" +
      '<div class="tile"><span class="eyebrow">On target</span><b>' + st.onTarget + '<span class="muted small"> / ' + st.withTarget + '</span></b></div><div class="tile"><span class="eyebrow">Active projects</span><b>' + st.activeProjects + "</b></div></div>" +
      '<div class="card stack-s"><div class="row between"><span class="eyebrow">Wins per week</span><span class="muted small">' + esc(line) + "</span></div>" + winsRhythm() + "</div></section>" +
      (recent.length ? '<section class="stack"><div class="row between"><h2>Latest wins</h2><a class="linkbtn" href="#wins">All wins</a></div><div class="grid2">' + recent.map(winTicket).join("") + "</div></section>" : "") +
      "</div>"
    );
  };

  // ---------- WINS ----------
  function winTicket(w) {
    const m = C.metricPhrase(w.metric);
    const comps = (w.competencies || []).map((id) => byId(ws.competencies, id)).filter(Boolean);
    return (
      '<article class="ticket"><div class="ticket-head"><b>WIN-' + String(w.n || 0).padStart(4, "0") + "</b><span>" + esc(C.fmtDateY(w.date)) + "</span></div><h3>" + esc(w.title) + "</h3>" +
      (w.result ? '<p class="result">' + esc(w.result) + "</p>" : "") +
      (m ? '<div class="metric">' + esc(m) + "</div>" : "") +
      (comps.length || w.onResume ? '<div class="row">' + comps.map((c) => '<span class="pill brown">' + esc(c.name) + "</span>").join("") + (w.onResume ? '<span class="pill ink">On résumé</span>' : "") + "</div>" : "") +
      '<div class="tear"></div><div class="acts"><button class="btn sm ghost" data-act="edit-win" data-id="' + w.id + '">' + icon("edit") + 'Edit</button><button class="btn sm ghost" data-act="bullet" data-id="' + w.id + '">Résumé bullet</button></div></article>'
    );
  }
  VIEWS.wins = function () {
    const q = ui.winQ.toLowerCase();
    const list = sortDesc(ws.wins, "date").filter((w) => (!ui.winComp || (w.competencies || []).includes(ui.winComp)) && (!q || [w.title, w.situation, w.action, w.result].join(" ").toLowerCase().includes(q)));
    const counts = C.evidenceCounts(ws);
    return (
      '<div class="view">' +
      head(plural(ws.wins.length, "win") + " logged", "Wins", '<button class="btn ghost" data-act="brag">Brag doc</button><button class="btn brown" data-act="new-win">' + icon("plus") + "Log a win</button>") +
      '<p class="muted">Your evidence file. Every win is proof for your promotion case, your résumé and your weekly update. Log it the day it happens, while the numbers are fresh.</p>' +
      '<div class="fields2"><label class="field" for="win-q"><span class="sr">Search wins</span><input class="input" id="win-q" type="search" placeholder="Search wins" value="' + esc(ui.winQ) + '" data-bind="winQ"></label>' +
      '<label class="field" for="win-comp"><span class="sr">Filter by competency</span><select class="select" id="win-comp" data-bind="winComp"><option value="">All competencies</option>' +
      ws.competencies.map((c) => '<option value="' + c.id + '"' + (ui.winComp === c.id ? " selected" : "") + ">" + esc(c.name) + " (" + (counts[c.id] || 0) + ")</option>").join("") + "</select></label></div>" +
      (list.length ? '<div class="grid2">' + list.map(winTicket).join("") + "</div>" : ws.wins.length ? '<div class="empty"><b>No matches</b><span>Try a different search or competency.</span></div>' : '<div class="empty"><b>No wins yet</b><span>Think about the last shift. Did you fix something, coach someone, or hit a number? That counts.</span><button class="btn brown" data-act="new-win">Log your first win</button></div>') +
      "</div>"
    );
  };
  function winForm(w, prefill) {
    w = w || Object.assign({ date: t0(), metric: {}, competencies: [] }, prefill || {});
    const m = w.metric || {};
    return (
      '<form data-form="win" data-id="' + esc(w.id || "") + '">' +
      fieldText("title", "What happened?", w.title, { req: true, ph: "e.g. Cut INF misses on the frozen aisle" }) +
      fieldText("date", "Date", w.date, { type: "date" }) +
      fieldText("situation", "Situation", w.situation, { area: true, rows: 2, ph: "What was the problem or opportunity?" }) +
      fieldText("action", "What you did", w.action, { area: true, rows: 2, ph: "Start with a verb: led, trained, rebuilt, fixed…" }) +
      fieldText("result", "Result", w.result, { area: true, rows: 2, ph: "What changed because of it?" }) +
      '<fieldset class="stack-s" style="border:0;padding:0;margin:0"><legend class="field"><span>Measured change <span class="muted small">(optional, your real numbers only)</span></span></legend><div class="fields2">' +
      fieldText("mlabel", "Metric", m.label, { ph: "e.g. INF rate" }) + fieldText("mbefore", "Before", m.before, { mode: "decimal" }) + fieldText("mafter", "After", m.after, { mode: "decimal" }) +
      fieldSelect("munit", "Unit", m.unit || "", [["", "count"], ["%", "%"], ["$", "$"], ["min", "min"], ["UPH", "UPH"], ["hrs", "hrs"]]) + "</div></fieldset>" +
      '<div class="field"><span>What it shows</span><div class="togglechips">' + ws.competencies.map((c) => '<label><input type="checkbox" name="comp" value="' + c.id + '"' + ((w.competencies || []).includes(c.id) ? " checked" : "") + "><span>" + esc(c.name) + "</span></label>").join("") + "</div></div>" +
      '<div class="sheet-foot">' + (w.id ? '<button type="button" class="btn danger sm" data-act="ask-del" data-kind="win" data-id="' + w.id + '">Delete</button>' : "") + '<span class="grow"></span><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn brown">Save win</button></div>' +
      '<div data-confirm></div></form>'
    );
  }

  // ---------- METRICS ----------
  function sparkSvg(k, weeks, big) {
    const series = C.kpiSeries(k, weeks);
    const W = big ? 600 : 240, H = big ? 180 : 56, pad = big ? 16 : 6;
    const t = C.num(k.target);
    const sp = C.sparkPoints(series, W, H, pad, t);
    let out = "";
    if (big && sp.segments.length) {
      for (const v of [sp.min, (sp.min + sp.max) / 2, sp.max]) {
        const y = sp.y(v).toFixed(1);
        out += '<line x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/><text x="0" y="' + (y - 4) + '" font-size="11" font-family="var(--mono)" fill="var(--muted)">' + esc(C.fmtNum(v, k.unit)) + "</text>";
      }
    }
    if (t !== null && sp.segments.length) {
      const y = sp.y(t).toFixed(1);
      out += '<line x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>';
      if (big) out += '<text x="' + W + '" y="' + (y - 4) + '" text-anchor="end" font-size="11" font-family="var(--mono)" fill="var(--muted)">target ' + esc(C.fmtNum(t, k.unit)) + "</text>";
    }
    for (const seg of sp.segments) {
      const pts = seg.map((p) => p.join(",")).join(" ");
      if (seg.length > 1) out += '<polygon points="' + seg[0][0] + "," + H + " " + pts + " " + seg[seg.length - 1][0] + "," + H + '" fill="var(--brown)" fill-opacity="0.10"/>';
      out += '<polyline points="' + pts + '" fill="none" stroke="var(--brown)" stroke-width="' + (big ? 2.5 : 2) + '" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    const last = sp.segments.length ? sp.segments[sp.segments.length - 1].slice(-1)[0] : null;
    if (last) out += '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="' + (big ? 5 : 3.5) + '" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>';
    if (big) out += [0, Math.floor(weeks / 2), weeks - 1].map((i) => '<text x="' + ((i * W) / (weeks - 1)).toFixed(1) + '" y="' + (H + 14) + '" text-anchor="' + (i === 0 ? "start" : i === weeks - 1 ? "end" : "middle") + '" font-size="11" font-family="var(--mono)" fill="var(--muted)">' + C.fmtDate(series[i].week) + "</text>").join("");
    if (!sp.segments.length) out += '<text x="' + W / 2 + '" y="' + H / 2 + '" text-anchor="middle" font-size="12" fill="var(--muted)">No entries yet</text>';
    return '<svg class="' + (big ? "chart" : "spark") + '" viewBox="0 0 ' + W + " " + (big ? H + 20 : H) + '" preserveAspectRatio="' + (big ? "xMidYMid meet" : "none") + '" role="img" aria-label="' + esc(k.name) + ' trend">' + out + "</svg>";
  }
  const STATE_PILL = { on: ["solid", "On target"], near: ["warn", "Close"], off: ["bad", "Off target"], logged: ["", "No target"], none: ["", "Not logged"] };
  VIEWS.metrics = function () {
    const wk = C.weekOf(t0());
    return (
      '<div class="view">' +
      head("Week of " + C.fmtDate(wk), "Numbers", '<button class="btn ghost" data-act="new-kpi">' + icon("plus") + 'Add metric</button><button class="btn brown" data-act="log-week">Log this week</button>') +
      '<p class="muted">Track the numbers your building is judged on. Log once a week from your site dashboard. A supervisor who can show their trend lines gets taken seriously.</p>' +
      (ws.kpis.length
        ? '<div class="grid2">' +
          ws.kpis.map((k) => {
            const s = C.kpiStatus(k);
            const [cls, label] = STATE_PILL[s.state];
            const tr = s.trend > 0 ? '<span class="trend-up mono small">▲ better</span>' : s.trend < 0 ? '<span class="trend-down mono small">▼ worse</span>' : "";
            return '<button class="card kpi" data-act="kpi" data-id="' + k.id + '"><div class="row between"><span class="eyebrow">' + esc(k.name) + '</span><span class="pill ' + cls + '">' + label + '</span></div><div class="row between"><span class="kpi-val">' + esc(s.value === null ? "—" : C.fmtNum(s.value, k.unit)) + "</span>" + tr + "</div>" + sparkSvg(k, 12) + '<span class="muted small mono">' + (s.target !== null ? "Target " + esc(C.fmtNum(s.target, k.unit)) + " · " : "") + (k.better === "lower" ? "lower is better" : "higher is better") + "</span></button>";
          }).join("") + "</div>"
        : '<div class="empty"><b>Pick the numbers you own</b><span>Start with two or three. You can add more later.</span><div class="togglechips">' + C.KPI_PRESETS.map((p, i) => '<button class="chip" data-act="add-preset" data-i="' + i + '">' + esc(p.name) + "</button>").join("") + "</div></div>") +
      "</div>"
    );
  };
  function kpiForm(k) {
    k = k || { better: "higher", unit: "" };
    return (
      '<form data-form="kpi" data-id="' + esc(k.id || "") + '">' +
      fieldText("name", "Metric name", k.name, { req: true, ph: "e.g. Units per hour" }) +
      '<div class="fields2">' + fieldText("unit", "Unit", k.unit, { ph: "%, $, min, UPH" }) + fieldText("target", "Target", k.target == null ? "" : k.target, { mode: "decimal" }) + fieldSelect("better", "Better is", k.better, [["higher", "Higher"], ["lower", "Lower"]]) + "</div>" +
      (k.id ? "" : '<div class="field"><span>Or start from a common one</span><div class="togglechips">' + C.KPI_PRESETS.map((p, i) => '<button type="button" class="chip" data-act="fill-preset" data-i="' + i + '">' + esc(p.name) + "</button>").join("") + "</div></div>") +
      '<div class="sheet-foot">' + (k.id ? '<button type="button" class="btn danger sm" data-act="ask-del" data-kind="kpi" data-id="' + k.id + '">Delete metric</button>' : "") + '<span class="grow"></span><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn brown">Save</button></div><div data-confirm></div></form>'
    );
  }
  function logWeekForm(week) {
    return (
      '<form data-form="logweek">' +
      fieldText("week", "Week starting (Monday)", week, { type: "date", hint: "Any day works; it's filed under that week's Monday." }) +

      }).join("") +
      '<div class="sheet-foot"><span class="grow"></span><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn brown">Save numbers</button></div></form>'
    );
  }

  // ---------- PROMOTION PATH ----------
  VIEWS.path = function () {

      readinessCard(false) +
      '<section class="card"><div class="row between"><h2>Competencies</h2><span class="muted small">Rate yourself honestly · ◆ marks the target</span></div>' +
      ws.competencies.map((c) => {

        return '<div class="comp"><div class="row between"><div class="stack-s" style="flex:1 1 220px"><h3>' + esc(c.name) + '</h3><span class="muted small">' + esc(c.desc || "") + '</span></div><div class="row">' +
          '<button class="pill ' + (ev[c.id] ? "brown" : "bad") + '" style="border:0;cursor:pointer" data-act="comp-wins" data-id="' + c.id + '">' + plural(ev[c.id] || 0, "win") + "</button>" +
          (gap > 0 ? '<span class="pill warn">Gap ' + gap + "</span>" : '<span class="pill solid">At target</span>') + "</div></div>" +
          '<div class="rating" role="group" aria-label="' + esc(c.name) + ' rating">' + C.RATING_LABELS.map((l, i) => '<button type="button" data-act="rate" data-id="' + c.id + '" data-v="' + i + '" aria-pressed="' + (Number(c.rating) === i) + '" class="' + (Number(c.target) === i ? "target" : "") + '" title="' + esc(l) + '">' + i + "</button>").join("") + "</div>" +
          '<div class="row between small muted"><span>' + esc(C.RATING_LABELS[c.rating || 0]) + '</span><label class="row" for="tg-' + c.id + '">Target <select class="select" style="min-height:32px;width:auto;padding:2px 8px" id="tg-' + c.id + '" data-act-change="target" data-id="' + c.id + '">' + [1, 2, 3, 4].map((v) => '<option value="' + v + '"' + (Number(c.target) === v ? " selected" : "") + ">" + v + " · " + C.RATING_LABELS[v] + "</option>").join("") + "</select></label></div></div>";
      }).join("") +
      '<div class="row" style="padding-top:12px"><button class="btn sm ghost" data-act="edit-comps">Edit competency list</button></div></section>' +
      '<section class="card stack"><div class="row between"><h2>30 / 60 / 90 plan</h2>' + (sample ? '<button class="btn sm ghost" data-act="ai-plan">' + icon("spark") + "Ask Ruhv for next steps</button>" : "") + "</div>" +
      '<p class="muted small">Small, specific moves your manager can see. Ask them what "ready" looks like, then put it here.</p>' +
      phases.map(([ph, label]) => {

    host.hidden = false;

    const first = host.querySelector("input:not([type=hidden]):not(.sr), textarea, select");

  function closeSheet() {
    const host = $("#sheet");
    if (!host) return;
    host.innerHTML = "";
    host.hidden = true;
    document.body.style.overflow = "";

    if (aiAbort) aiAbort.abort();

  let toastTimer = null;
  function toast(msg, actLabel, actFn) {
    const host = $("#toast");
    host.innerHTML = '<div class="toast" role="status"><span>' + esc(msg) + "</span>" + (actLabel ? '<button type="button">' + esc(actLabel) + "</button>" : "") + "</div>";
    host.hidden = false;
    if (actLabel) host.querySelector("button").onclick = () => { host.hidden = true; actFn(); };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (host.hidden = true), actLabel ? 7000 : 3200);
  }
  function confirmIn(container, msg, label, fn) {
    const el = $(container);
    if (!el) return;
    el.innerHTML = '<div class="confirm"><p>' + esc(msg) + '</p><button type="button" class="btn sm ghost" data-act="cancel-confirm">Keep</button><button type="button" class="btn sm danger" data-confirm-go>' + esc(label) + "</button></div>";
    el.querySelector("[data-confirm-go]").onclick = fn;
  }
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);

      const ta = $("#f-dbody") || $("#bullet-text");

      toast("Copy didn't work here. The text is selected so you can copy it.");

    }
  }
  async function saveFile(filename, data) {
    if (!downloads) {
      toast("Saving files isn't available here. Use Copy instead.");

      await downloads.save({ filename, data });
      toast("Saved " + filename);

      if (e && e.code !== "declined") toast("Couldn't save the file. Try Copy instead.");

  }

  // ---------- Ask Ruhv (Claude, only on request) ----------
  let aiAbort = null;
  function aiBox(html) {
    const el = $("[data-ai]");
    if (el) el.innerHTML = html;
  }
  async function aiPolish(d) {
    if (!sample) return;
    const body = $("#f-dbody").value;
    aiAbort = new AbortController();
    aiBox('<div class="stack-s"><span class="ai-note">Ruhv is rewriting…</span><div class="out" data-ai-out>Thinking…</div></div>');
    const prompt =
      "You are Ruhv, a calm, practical career coach inside CareerCrumbs, an app for a warehouse supervisor at DashMart (DoorDash's own convenience and grocery stores) who wants a promotion to " + (ws.profile.targetRole || "operations manager") + ".\n\n" +
      "Rewrite the draft below (" + (C.DRAFT_KINDS[d.kind] || "draft") + ") so it is clear, confident and concise, in plain workplace English. Rules: keep every fact and number exactly as written; never add numbers, results or claims that aren't in the draft; keep [bracketed placeholders] as they are; keep the same sections; no emojis; no preamble — return only the rewritten text.\n\nDRAFT:\n" + body;
    try {
      const res = await sample(prompt, { signal: aiAbort.signal, modelTier: "default", cache: false, onText: ({ text }) => { const o = $("[data-ai-out]"); if (o) o.textContent = text; } });
      aiBox('<div class="stack-s"><span class="ai-note">Written by Ruhv (Claude). Check facts before you send it.</span><div class="out" data-ai-out>' + esc(res.text) + '</div><div class="row"><button class="btn sm brown" data-act="ai-use">Use this version</button><button class="btn sm ghost" data-act="ai-dismiss">Keep mine</button></div></div>');
      ui.aiText = res.text;
    } catch (e) {
      if (e && e.name === "AbortError") return;
      aiBox('<p class="small muted">' + (e && e.code === "rate_limited" ? "Ruhv needs a short break. Try again in a minute." : e && e.code === "not_granted" ? "Ruhv isn't switched on for this page." : "Ruhv couldn't answer just now.") + "</p>");
    }
  }
  async function aiPlan() {
    if (!sample) return;
    const r = C.readiness(ws);
    const gaps = r.gaps.slice(0, 4).map((g) => g.c.name + " (rated " + (g.c.rating || 0) + "/4, target " + g.c.target + ", " + g.ev + " wins logged)").join("; ");
    const existing = ws.plan.map((s) => s.text).join("; ");
    openSheet("Ruhv's suggestions", '<div class="sheet-body"><span class="ai-note">Asking Ruhv…</span><div data-ai></div></div>');
    aiAbort = new AbortController();
    try {
      const out = await sample.json(
        "You are Ruhv, a practical career coach for a " + ws.profile.role + " at DashMart (DoorDash's own convenience and grocery stores) working toward " + ws.profile.targetRole + ". Biggest gaps: " + (gaps || "none recorded") + ". Plan steps they already have: " + (existing || "none") + ".\n" +
        "Suggest 5 concrete, observable actions they can take in the next 90 days that would close these gaps and be visible to their manager. Each must be specific to running a dark-store warehouse shift (picking, INF, dasher handoff, inventory, labor, safety, team development). Don't repeat existing steps. Return JSON: [{\"text\": string (max 110 chars, starts with a verb), \"phase\": \"30\"|\"60\"|\"90\", \"why\": string (max 90 chars)}]",
        { signal: aiAbort.signal, modelTier: "default" }
      );
      const list = Array.isArray(out) ? out.filter((x) => x && x.text).slice(0, 6) : [];
      ui.aiPlan = list;
      $(".sheet-body").innerHTML = '<span class="ai-note">Written by Ruhv (Claude). Add the ones that fit.</span>' + (list.length ? '<div class="list">' + list.map((x, i) => '<div class="li" style="cursor:default"><span class="row between"><b>' + esc(x.text) + '</b><span class="pill">' + esc(x.phase || "30") + ' days</span></span><span class="small muted">' + esc(x.why || "") + '</span><span><button class="btn sm ghost" data-act="ai-plan-add" data-i="' + i + '">Add to plan</button></span></div>').join("") + "</div>" : '<p class="muted">No suggestions came back. Try again.</p>');
    } catch (e) {
      if (e && e.name === "AbortError") return;
      const b = $(".sheet-body");
      if (b) b.innerHTML = '<p class="muted">' + (e && e.code === "rate_limited" ? "Ruhv needs a short break. Try again in a minute." : "Ruhv couldn't answer just now.") + "</p>";
    }
  }
