<style>
/* Layout: phone-first single column with four bottom tabs; a left rail from 900px.
   Look: CareerCrumbs brand. Black, white and brown only; Ruhv the mouse as the mark;
   condensed caps headings and mono labels like an index card. */
:root {
  --paper: #faf8f5;

  --cream: #f5eee4;

  --warn: #8a5c0c;
  --warn-soft: #f7eedb;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141110; --surface: #1c1816; --sunk: #25201d; --ink: #f2eee9; --muted: #a79c92; --line: #332c27;
    --brown: #c8925f; --brown-ink: #1b1209; --brown-soft: #2c2219; --espresso: #2a1f19; --cream: #f5eee4;
    --bad: #ea8a72; --bad-soft: #3a1f19; --warn: #e0b04f; --warn-soft: #33281a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141110; --surface: #1c1816; --sunk: #25201d; --ink: #f2eee9; --muted: #a79c92; --line: #332c27;
  --brown: #c8925f; --brown-ink: #1b1209; --brown-soft: #2c2219; --espresso: #2a1f19; --cream: #f5eee4;
  --bad: #ea8a72; --bad-soft: #3a1f19; --warn: #e0b04f; --warn-soft: #33281a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { color: var(--ink); font: 400 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }

/* ---------- shell ---------- */
.app { display: grid; min-height: 100%; }
.rail { display: none; }
.main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--tabbar) + 32px + env(safe-area-inset-bottom, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding-block: 10px; margin-bottom: 8px; background: var(--paper); border-bottom: 1px solid var(--line); }

.tabbar { position: fixed; inset: auto 0 0; z-index: 25; display: grid; grid-template-columns: repeat(4, 1fr); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--surface); border-top: 1px solid var(--line); }

  .rail .brand { padding: 4px 10px 20px; }

/* ---------- sheet, toast ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 8, 6, 0.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: 16px 16px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

.sheet-foot .grow { flex: 1; }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 16px; max-height: 88vh; } .sheet-grip { display: none; } }

<script>
// CareerCrumbs: pure helpers for a job search. No DOM, no storage, no AI.
(function (root) {
  "use strict";

  // ---------- ids, dates, text ----------
  const uid = (p) => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const today = (now) => iso(now || new Date());
  const parse = (s) => {
    const [y, m, d] = String(s).slice(0, 10).split("-").map(Number);
    return new Date(y, (m || 1) - 1, d || 1);
  };
  const addDays = (s, n) => {
    const d = parse(s);
    d.setDate(d.getDate() + n);
    return iso(d);
  };
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const fmtDate = (s) => (s ? MONTHS[parse(s).getMonth()] + " " + parse(s).getDate() : "");
  const fmtDateY = (s) => (s ? fmtDate(s) + ", " + parse(s).getFullYear() : "");
  const fmtTime = (dt) => {
    const m = String(dt || "").match(/T(\d{2}):(\d{2})/);
    if (!m) return "";
    const h = Number(m[1]);
    return (h % 12 || 12) + ":" + m[2] + (h < 12 ? " am" : " pm");
  };
  const fmtWhen = (dt) => (dt ? DAYS[parse(dt).getDay()] + " " + fmtDate(dt) + (fmtTime(dt) ? ", " + fmtTime(dt) : "") : "");
  const relDays = (s, now) => {
    const n = daysBetween(today(now), s);
    if (n === 0) return "today";
    if (n === 1) return "tomorrow";
    if (n === -1) return "yesterday";
    return n > 0 ? "in " + n + " days" : Math.abs(n) + " days ago";
  };
  const clean = (s) => String(s || "").trim().replace(/\s+/g, " ").replace(/[.\s]+$/, "");
  const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
  const lower1 = (s) => (s && !/^[A-Z]{2}/.test(s) ? s.charAt(0).toLowerCase() + s.slice(1) : s);
  const firstName = (s) => String(s || "").trim().split(/\s+/)[0] || "";

  // ---------- question bank ----------
  // Written for everyday jobs: warehouse, retail, customer service, team lead.
  const PACKS = {
    common: "Common",
    behavioral: "Behavioral",
    warehouse: "Warehouse & operations",
    service: "Customer service & retail",
    lead: "Lead & supervisor",
    ask: "Questions to ask them",
    mine: "My questions",
  };
  const STAR_TIP = "Use a real example. Situation and task in one or two sentences, most of your time on what you did, then the result. A number makes it stick.";
  const Q = (id, pack, q, tip, star) => ({ id, pack, q, tip: tip || (star ? STAR_TIP : ""), star: !!star });
  const BANK = [
    Q("c1", "common", "Tell me about yourself.", "Present, past, future in about a minute: what you do now, one or two things from before that fit this job, and why you want this one. Keep your personal life out of it."),
    Q("c2", "common", "Why do you want to work here?", "Name something specific about this company or job: the schedule, the team, what they're known for, a chance to grow. Then connect it to you."),
    Q("c3", "common", "Why should we hire you?", "Three reasons that match the job posting, each backed by something you've done. End with how quickly you'll be useful."),
    Q("c4", "common", "What are your greatest strengths?", "Pick two that the job needs and give a quick example of each. Reliable, fast, accurate and good with people all count if you can prove them."),
    Q("c5", "common", "What's a weakness you're working on?", "Pick a real one that won't sink you for this job, then spend most of the answer on what you're doing about it."),
    Q("c6", "common", "Why are you leaving your current job?", "Stay positive and look forward: more hours, growth, a better fit, a shorter commute. Never criticise your current employer."),
    Q("c7", "common", "Tell me about a gap in your work history.", "Be brief and honest: caregiving, school, health, a move, a hard job market. Then say what you did to stay sharp and that you're ready now."),
    Q("c8", "common", "What is your availability?", "Know your real answer before the interview: days, shifts, weekends, overtime, start date. Being flexible helps, but don't promise what you can't keep."),
    Q("c9", "common", "What are your pay expectations?", "Look up the going rate first. Give a range you'd be happy with, or say you're open and ask what the range is for the role."),
    Q("c10", "common", "Where do you see yourself in a few years?", "Show you'd like to stay and grow: get great at this job, then take on more, like training others or leading a shift."),
    Q("b1", "behavioral", "Tell me about a time you had a conflict with a coworker.", "", true),
    Q("b2", "behavioral", "Tell me about a mistake you made at work and what you did about it.", "Own it quickly, spend most of the answer on how you fixed it, and finish with what you do differently now.", true),
    Q("b3", "behavioral", "Describe a time you worked under pressure or a tight deadline.", "", true),
    Q("b4", "behavioral", "Tell me about a time you went above and beyond.", "", true),
    Q("b5", "behavioral", "Tell me about a time you worked on a team to reach a goal.", "Say what the team did and what you did. Use I for your part.", true),
    Q("b6", "behavioral", "Tell me about a time you disagreed with your manager.", "Show you raised it respectfully, listened, and still did the work. A good ending is that you found a better way together.", true),
    Q("b7", "behavioral", "Tell me about a time you had to learn something new quickly.", "", true),
    Q("b8", "behavioral", "Tell me about a time you took initiative without being asked.", "", true),
    Q("b9", "behavioral", "How do you handle a lot of tasks at once?", "Give your method (what comes first and why), then a short example of a busy day where it worked.", true),
    Q("b10", "behavioral", "Tell me about a time you got critical feedback.", "Show you listened without getting defensive, made a change, and what improved.", true),
    Q("w1", "warehouse", "Tell me about a time you spotted a safety hazard.", "Safety answers win warehouse interviews. Say what you saw, that you stopped or reported it, and what changed.", true),
    Q("w2", "warehouse", "How do you keep up with productivity targets?", "Mention a rate you've hit if you have one (units or orders per hour), and how: staying organised, learning the layout, not cutting corners on accuracy."),
    Q("w3", "warehouse", "How do you make sure your work is accurate?", "Double-checking labels and counts, scanning carefully, fixing mistakes right away. An example of catching an error is gold.", true),
    Q("w4", "warehouse", "This job is physical and the shifts can be long. How do you handle that?", "Be honest and confident: past physical work, how you pace yourself, that you're reliable on long or early shifts."),
    Q("w5", "warehouse", "What equipment have you used?", "List what you've actually used: RF scanner, pallet jack, forklift (certified?), label printers, warehouse software. Say you learn new equipment quickly."),
    Q("w6", "warehouse", "Tell me about a time it got really busy. How did you handle the rush?", "", true),
    Q("w7", "warehouse", "What would you do if you saw a coworker skipping a safety rule?", "Speak up respectfully in the moment, and tell a lead if it continues. Safety comes before friendship or speed."),
    Q("s1", "service", "Tell me about a time you dealt with an upset customer.", "Stay calm, listen, apologise for the experience, fix what you can, and get help when you can't. Finish with how the customer left.", true),
    Q("s2", "service", "What does great customer service mean to you?", "Give your definition in one line, then a quick example of you doing it."),
    Q("s3", "service", "How do you handle several customers needing you at once?", "Acknowledge everyone, help in order, call for backup when needed. A real example helps.", true),
    Q("s4", "service", "Tell me about a time you made a customer's day.", "", true),
    Q("s5", "service", "How do you handle cash and keep your drawer accurate?", "Count carefully, follow the procedures, and speak up right away if something's off. Mention any time you were balanced or trusted with closing."),
    Q("l1", "lead", "How do you motivate a team?", "Specific recognition, clear goals for the shift, fairness, and leading by example. Back it with a moment it worked.", true),
    Q("l2", "lead", "Tell me about a time you dealt with an underperforming team member.", "Private conversation, clear expectations, support or training, follow-up. Show you were fair and firm.", true),
    Q("l3", "lead", "How do you handle call-outs when you're short-staffed?", "Re-prioritise, move people to the most important work, jump in yourself, and communicate early with your manager.", true),
    Q("l4", "lead", "Tell me about a time you resolved a conflict between two team members.", "", true),
    Q("l5", "lead", "How do you give feedback to someone who isn't meeting expectations?", "Specific, private, soon after it happens, focused on the behaviour and the fix. Follow up."),
    Q("l6", "lead", "What would you do in your first 90 days in this role?", "Learn the people and the numbers first, find one or two quick wins, then build a plan with your manager."),
    Q("a1", "ask", "What does a great first 90 days look like in this role?", "Shows you plan to do well. Write down their answer."),
    Q("a2", "ask", "How do you measure success for this position?", ""),
    Q("a3", "ask", "What do you like most about working here?", ""),
    Q("a4", "ask", "What's the biggest challenge the team is facing right now?", ""),
    Q("a5", "ask", "How do people grow here? Is there training or a path to lead?", ""),
    Q("a6", "ask", "What are the next steps, and when should I expect to hear back?", "Always ask this one. It tells you when to follow up."),
  ];

  // Words per minute for a relaxed interview pace.
  const WPM = 140;
  function answerText(a) {
    if (!a) return "";
    if (a.mode === "star") return ["s", "t", "a", "r"].map((k) => clean(a[k])).filter(Boolean).join(". ");
    return String(a.text || "").trim();
  }
  const wordCount = (s) => (String(s || "").match(/[A-Za-z0-9’']+/g) || []).length;
  function speakTime(words) {
    const sec = Math.round((words / WPM) * 60);
    return Math.floor(sec / 60) + ":" + pad(sec % 60);
  }
  // Coaching on length only; never on content.
  function lengthHint(q, words) {
    if (!words) return "";
    if (q.pack === "ask") return "";
    const sec = (words / WPM) * 60;
    const long = q.star ? 150 : 100;
    if (sec < 20) return "Short. Add a detail or an example.";
    if (sec > long) return "Long. Try cutting it to two minutes or less.";
    return "Good length.";
  }

  // ---------- jobs ----------
  const STATUSES = ["Saved", "Applied", "Interview", "Offer", "Closed"];
  function setStatus(job, status, now) {
    const at = (now || new Date()).toISOString();
    const next = Object.assign({}, job, { status });
    next.history = (job.history || []).concat([{ status, at }]);
    if (status === "Applied" && !job.appliedAt) next.appliedAt = at.slice(0, 10);
    return next;
  }
  function jobBadge(job, now) {
    const t = today(now);
    if (job.status === "Closed" || job.status === "Offer") return null;
    if (job.interviewAt && job.interviewAt.slice(0, 10) >= t) {
      const n = daysBetween(t, job.interviewAt);
      return { tone: n <= 1 ? "warn" : "brown", text: "Interview " + (n <= 1 ? relDays(job.interviewAt, now) : fmtWhen(job.interviewAt)) + (n <= 1 && fmtTime(job.interviewAt) ? " " + fmtTime(job.interviewAt) : "") };
    }
    if (job.followUpAt) {
      const n = daysBetween(t, job.followUpAt);
      if (n < 0) return { tone: "bad", text: "Follow-up overdue by " + -n + (n === -1 ? " day" : " days") };
      if (n === 0) return { tone: "warn", text: "Follow up today" };
      return { tone: "", text: "Follow up " + relDays(job.followUpAt, now) };
    }
    return null;
  }
  // What needs doing today, most urgent first.
  function todo(ws, now) {
    const t = today(now);
    const out = [];
    for (const j of ws.jobs) {
      if (j.status === "Closed") continue;
      if (j.interviewAt) {
        const n = daysBetween(t, j.interviewAt);
        if (n >= 0 && n <= 3) out.push({ tone: n <= 1 ? "warn" : "", job: j.id, act: "prep", title: "Prepare: " + j.title + " at " + j.company, sub: "Interview " + relDays(j.interviewAt, now) + (fmtTime(j.interviewAt) ? " at " + fmtTime(j.interviewAt) : "") });
        if (n < 0 && n >= -3 && !j.thankYouSent && j.status === "Interview") out.push({ tone: "warn", job: j.id, act: "messages", title: "Send a thank-you to " + j.company, sub: "Interviewed " + relDays(j.interviewAt, now) + ". Within 24 hours is best." });
      }
      if (j.followUpAt && daysBetween(t, j.followUpAt) <= 0) out.push({ tone: daysBetween(t, j.followUpAt) < 0 ? "bad" : "warn", job: j.id, act: "messages", title: "Follow up with " + j.company, sub: j.title + " · " + (daysBetween(t, j.followUpAt) < 0 ? "overdue" : "due today") });
    }
    const rank = { bad: 0, warn: 1, "": 2 };
    return out.sort((a, b) => rank[a.tone] - rank[b.tone]);
  }
  function nextInterview(ws, now) {
    const t = today(now);
    return ws.jobs.filter((j) => j.interviewAt && j.interviewAt.slice(0, 10) >= t && j.status !== "Closed").sort((a, b) => (a.interviewAt < b.interviewAt ? -1 : 1))[0] || null;
  }

  // Message templates. Plain, polite and short; [brackets] mark what to fill in.
  function messages(job, profile) {
    const me = clean(profile.name) || "[Your name]";
    const hi = job.contact ? "Hi " + firstName(job.contact) + "," : "Hello,";
    const role = job.title || "[role]";
    const co = job.company || "[company]";
    return [
      { id: "followup", label: "Follow up on my application", subject: "Following up: " + role + " application", body: hi + "\n\nI applied for the " + role + " position" + (job.appliedAt ? " on " + fmtDate(job.appliedAt) : "") + " and wanted to follow up. I'm still very interested and I'm available to interview at your convenience.\n\nThank you for your time,\n" + me },
      { id: "thanks", label: "Thank you after the interview", subject: "Thank you: " + role + " interview", body: hi + "\n\nThank you for meeting with me" + (job.interviewAt ? " " + (daysBetween(job.interviewAt.slice(0, 10), today()) <= 0 ? "today" : "on " + fmtDate(job.interviewAt)) : "") + " about the " + role + " position. I enjoyed learning about [something you discussed], and I'm even more excited about the chance to join " + co + ".\n\n[One line on why you're a good fit.]\n\nPlease let me know if you need anything else from me.\n\nBest,\n" + me },
      { id: "confirm", label: "Confirm an interview time", subject: "Interview confirmation: " + role, body: hi + "\n\nThank you for the invitation. I'm confirming my interview for the " + role + " position" + (job.interviewAt ? " on " + fmtWhen(job.interviewAt) : " on [day and time]") + ". Please let me know if there's anything I should bring.\n\nSee you then,\n" + me },
      { id: "status", label: "Check on a decision", subject: "Checking in: " + role, body: hi + "\n\nI hope you're well. I'm checking in on the " + role + " position. I'm still very interested in joining " + co + " and would be glad to answer any other questions.\n\nThank you,\n" + me },
      { id: "decline", label: "Withdraw politely", subject: role + " application", body: hi + "\n\nThank you for considering me for the " + role + " position. I've decided to accept another offer, so I'd like to withdraw my application. I appreciate your time and hope our paths cross again.\n\nBest,\n" + me },
    ];
  }

  // ---------- stories & résumé ----------
  const VERB_MAP = [
    [/^(led|lead|leading)\b/i, "Led"],
    [/^(train|trained|training|coach|coached|coaching)\b/i, "Trained"],
    [/^(reduce|reduced|cut|lower|lowered)\b/i, "Reduced"],
    [/^(improve|improved|raise|raised|increase|increased|boost|boosted)\b/i, "Improved"],
    [/^(build|built|create|created|set up|launch|launched|started)\b/i, "Built"],
    [/^(fix|fixed|solve|solved|resolve|resolved)\b/i, "Resolved"],
    [/^(help|helped|assist|assisted)\b/i, "Helped"],
    [/^(handle|handled|manage|managed|ran|run)\b/i, "Managed"],
  ];
  // Template only: the person's own words, and a [placeholder] where something is missing.
  function bulletFromStory(s) {
    let action = clean(s.action) || clean(s.title) || "[what you did]";
    let lead = "";
    for (const [re, verb] of VERB_MAP) {
      if (re.test(action)) {
        lead = verb;
        action = action.replace(re, "").trim();
        break;
      }
    }
    let text = lead ? lead + " " + lower1(action) : cap(action);
    const result = clean(s.result);
    text += result ? ", resulting in " + lower1(result) : ", resulting in [the result — add a number if you have one]";
    return text + ".";
  }
  function storyToStar(s) {
    return { mode: "star", s: clean(s.situation), t: clean(s.task), a: clean(s.action), r: clean(s.result), storyId: s.id };
  }

  // ---------- readiness ----------
  function bankFor(ws, packs) {
    const custom = (ws.interview.custom || []).map((c) => Object.assign({ pack: "mine", tip: "" }, c));
    return BANK.concat(custom).filter((q) => !packs || packs.includes(q.pack));
  }
  function status(ws, qid) {
    const a = ws.interview.answers[qid];
    if (!a) return "none";
    if (a.ready) return "ready";
    return answerText(a) ? "draft" : "none";
  }
  function readiness(ws, qs) {
    const list = qs.filter((q) => q.pack !== "ask");
    const ready = list.filter((q) => status(ws, q.id) === "ready").length;
    const draft = list.filter((q) => status(ws, q.id) === "draft").length;
    return { ready, draft, total: list.length, pct: list.length ? Math.round(((ready + draft * 0.5) / list.length) * 100) : 0 };
  }
  function jobQuestions(ws, job) {
    const packs = ["common", "behavioral"].concat(ws.profile.packs || []);
    const base = BANK.filter((q) => packs.includes(q.pack) && q.pack !== "ask");
    const mine = (ws.interview.custom || []).filter((c) => c.jobId === job.id).map((c) => Object.assign({ pack: "mine", tip: "" }, c));
    const ask = BANK.filter((q) => q.pack === "ask");
    return mine.concat(base, ask);
  }

  // One page to read in the parking lot before you walk in.
  function cheatSheet(ws, job, now) {
    const ans = (id) => answerText(ws.interview.answers[id]);
    const L = [(job.title || "Interview") + " — " + (job.company || ""), job.interviewAt ? fmtWhen(job.interviewAt) : "", ""].filter((x, i) => x || i === 2);
    if (job.contact) L.push("Meeting with: " + job.contact);
    if (job.notes) L.push("Notes: " + clean(job.notes));
    L.push("", "TELL ME ABOUT YOURSELF", ans("c1") || "[Write this one first in Interview]");
    L.push("", "WHY THIS JOB", ans("c2") || "[Why you want this job]");
    const mine = (ws.interview.custom || []).filter((c) => c.jobId === job.id);
    if (mine.length) {
      L.push("", "QUESTIONS FROM THE POSTING");
      for (const c of mine) L.push("- " + c.q + (ans(c.id) ? "\n  " + ans(c.id) : ""));
    }
    const stories = ws.stories.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 4);
    if (stories.length) {
      L.push("", "MY STORIES (have these ready)");
      for (const s of stories) L.push("- " + s.title + (clean(s.result) ? " → " + clean(s.result) : ""));
    }
    const asks = BANK.filter((q) => q.pack === "ask" && (ws.interview.answers[q.id] || {}).pick).map((q) => q.q);
    L.push("", "MY QUESTIONS FOR THEM");
    L.push((asks.length ? asks : BANK.filter((q) => q.pack === "ask").slice(0, 3).map((q) => q.q)).map((q) => "- " + q).join("\n"));
    L.push("", "BRING", "- Copies of your résumé, ID, a pen", "- Arrive 10 minutes early");
    return L.join("\n");
  }

  // ---------- calendar ----------
  function icsEscape(s) {
    return String(s || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
  }
  function interviewIcs(job, now) {
    const stamp = (now || new Date()).toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    const dt = job.interviewAt;
    const timed = /T\d{2}:\d{2}/.test(dt);
    const start = timed ? dt.replace(/[-:]/g, "").slice(0, 13) + "00" : dt.slice(0, 10).replace(/-/g, "");
    let end;
    if (timed) {
      const d = new Date(dt);
      d.setHours(d.getHours() + 1);
      end = iso(d).replace(/-/g, "") + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
    } else end = addDays(dt.slice(0, 10), 1).replace(/-/g, "");
    const v = timed ? "" : ";VALUE=DATE";
    return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//CareerCrumbs//EN", "BEGIN:VEVENT", "UID:cc-" + job.id + "@careercrumbs", "DTSTAMP:" + stamp, "DTSTART" + v + ":" + start, "DTEND" + v + ":" + end, "SUMMARY:" + icsEscape("Interview: " + job.title + " at " + job.company), "DESCRIPTION:" + icsEscape((job.contact ? "With " + job.contact + ". " : "") + "Bring résumé copies and ID. Send a thank-you within 24 hours."), "BEGIN:VALARM", "TRIGGER:-PT2H", "ACTION:DISPLAY", "DESCRIPTION:Interview in 2 hours", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n") + "\r\n";
  }

  // ---------- workspace ----------
  const emptyWorkspace = () => ({
    profile: { name: "", targetRole: "", packs: [] },
    jobs: [],
    stories: [],
    interview: { answers: {}, custom: [], practice: [] },
    storySeq: 0,
  });
  function normalize(ws) {
    const b = emptyWorkspace();
    const out = Object.assign({}, b, ws || {});
    out.profile = Object.assign({}, b.profile, (ws && ws.profile) || {});
    if (!Array.isArray(out.profile.packs)) out.profile.packs = [];
    out.jobs = (Array.isArray(out.jobs) ? out.jobs : []).map((j) => Object.assign({ status: "Saved", history: [] }, j));
    out.stories = Array.isArray(out.stories) ? out.stories : [];
    const iv = (ws && ws.interview) || {};
    out.interview = {
      answers: iv.answers && typeof iv.answers === "object" && !Array.isArray(iv.answers) ? Object.assign({}, iv.answers) : {},
      custom: Array.isArray(iv.custom) ? iv.custom : [],
      practice: Array.isArray(iv.practice) ? iv.practice : [],
    };
    out.storySeq = Math.max(Number(out.storySeq) || 0, out.stories.reduce((m, s) => Math.max(m, s.n || 0), 0));
    return out;
  }

  // Sample answers that show the shape of a good one. Shown behind "See an example"; never saved as the person's answer.
  const EXAMPLES = {
    c1: "I've worked in fast-paced jobs for about two years, most recently picking and packing orders at a grocery warehouse, where I kept my accuracy above 99%. Before that I worked a register, so I'm comfortable with customers and busy shifts. I'm looking for a role with steady hours where I can learn more equipment and grow into training new people, and this job fits that.",
    c2: "I've heard good things about how you treat your people, and the posting mentions training and a path to lead, which is what I'm looking for. The schedule also works well for me, so I know I can be reliable from day one.",
    c3: "Three reasons. I'm reliable: I didn't miss a shift last year. I'm accurate, which matters when every order goes to a customer. And I learn fast: I was picking on my own after my first week. I think I'd be useful quickly.",
    c4: "I'm dependable and I pay attention to detail. At my last job I was the person my lead asked to double-check a big order before it shipped, because I'd catch the mistakes.",
    c5: "I used to try to do everything myself instead of asking for help when it got busy. I've been working on it by speaking up earlier, like telling my lead when I'm falling behind instead of waiting. The shifts go smoother now.",
    c6: "I've learned a lot there, but I'm looking for more hours and a chance to grow, and there isn't room for that right now. This role offers both.",
    c7: "I took eight months off to care for a family member. During that time I kept my forklift certification current, and now I'm ready and available to work full time.",
    b1: "SITUATION: Two of us kept clashing over who restocked the cooler.\nTASK: It was slowing the shift down and I wanted it fixed.\nACTION: I asked him to talk on our break. We split the cooler by aisle and wrote it on the board.\nRESULT: The arguments stopped and restocking got faster.",
    b2: "SITUATION: I mislabeled a tote during a rush and it went to the wrong order.\nTASK: Fix it before it reached the customer.\nACTION: I told my lead right away, we pulled the tote, relabeled it and checked the rest of my batch.\nRESULT: The customer got the right order. Now I scan every label twice when it's busy.",
    s1: "SITUATION: A customer's order was missing items and they were upset at the counter.\nTASK: Fix it and keep them happy.\nACTION: I listened, apologised, found the missing items and walked them out myself.\nRESULT: They thanked me and later left a good review that mentioned me by name.",
    w1: "SITUATION: During a rush I saw a pallet jack left in the walkway by the pickup area.\nTASK: Keep people from tripping over it.\nACTION: I moved it to the parking spot, told my lead, and we added a quick reminder to the next huddle.\nRESULT: No one got hurt, and it stopped happening.",
  };

  const api = {
    uid, iso, today, parse, addDays, daysBetween, fmtDate, fmtDateY, fmtTime, fmtWhen, relDays, clean, firstName,
    PACKS, BANK, WPM, answerText, wordCount, speakTime, lengthHint,
    STATUSES, setStatus, jobBadge, todo, nextInterview, messages,
    bulletFromStory, storyToStar, bankFor, status, readiness, jobQuestions, cheatSheet, interviewIcs,
    emptyWorkspace, normalize, EXAMPLES,
  };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.CC = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
// CareerCrumbs UI: Home, Jobs, Interview, Stories, Me. Renders HTML strings, handles events by delegation.
(function () {
  "use strict";
  const C = window.CC;
  const $ = (s, el) => (el || document).querySelector(s);

  // ---------- state ----------
  let ws = C.emptyWorkspace();
  let mode = "loading"; // loading | cloud | local
  let syncState = "idle";
  let route = "home";
  const ui = { jobFilter: "Active", pack: "all", prepJob: null, sheetOpen: false };
  let db = null, uidv = null, downloads = null;

  // ---------- Ruhv & icons ----------
  // Ruhv, the CareerCrumbs mouse: one solid shape in currentColor; the eye and smile are cut-outs.
  const RUHV =
    '<ellipse cx="176" cy="152" rx="17" ry="22" transform="rotate(-14 176 152)"/><circle cx="219" cy="159" r="15"/><circle cx="272" cy="197" r="6"/>' +

  const NAV = [["home", "Home"], ["jobs", "Jobs"], ["interview", "Interview"], ["stories", "Stories"], ["me", "Me"]];

  // ---------- small helpers ----------
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  // ---------- persistence ----------
  // One document per area, in the viewer's own private space.
  const MODULES = { profile: ["profile"], jobs: ["jobs"], stories: ["stories", "storySeq"], interview: ["interview"] };
  const KEY_TO_MOD = {};
  for (const [m, keys] of Object.entries(MODULES)) for (const k of keys) KEY_TO_MOD[k] = m;
  const LS_KEY = "careercrumbs:v2";
  const dirty = new Set();
  let flushTimer = null, flushing = false;

  // Everything saves on its own; there is no account or setup step.
  function persist(...keys) {
    for (const k of keys) dirty.add(KEY_TO_MOD[k] || k);
    setSync("saving");

    flushTimer = setTimeout(flush, 500);
  }
  function save(...keys) {
    persist(...keys);
    render();
  }
  async function flush() {
    if (flushing) return void (flushTimer = setTimeout(flush, 300));
    flushing = true;
    try {
      if (mode === "cloud") {
        while (dirty.size) {
          const m = dirty.values().next().value;
          const body = { savedAt: new Date().toISOString() };
          for (const k of MODULES[m]) body[k] = ws[k];
          await db.doc("data/users/" + uidv + "/" + m).set(body);
          dirty.delete(m);
        }
      } else {
        dirty.clear();
        localStorage.setItem(LS_KEY, JSON.stringify(ws));
      }
      setSync("saved");
    } catch (e) {
      // Viewers who can't write to their account space still keep their work in this browser.
      if (mode === "cloud" && e && ["not_granted", "invalid_argument", "revoked", "capability_disabled"].includes(e.code)) {
        mode = "local";
        flushing = false;
        toast("Saving on this device instead of your account.");
        return flush();
      }
      setSync("error");
      toast(e && e.code === "quota_exceeded" ? "Storage is full. Export a backup and remove old jobs." : "Couldn't save just now. Your changes are still on screen.");
    } finally {

    }
  }
  function setSync(s) {

  async function boot() {

      (answerable.length ? '<div class="stack-s"><div class="small"><b>' + r.ready + "</b> ready · <b>" + r.draft + "</b> drafts · " + r.total + ' questions</div><div class="progress big"><i style="width:' + r.pct + '%"></i></div></div><div class="qlist">' + answerable.map((q) => questionRow(q, !!job || ui.pack === "all" || ui.pack === "work")).join("") + "</div>" : "") +
      (asks.length ? '<section class="stack"><h2>Questions to ask them</h2><p class="muted small">Tick two or three to bring. They go on your cheat sheet.</p><div class="qlist">' + asks.map((q) => questionRow(q)).join("") + "</div></section>" : "") +
      (!qs.length ? '<div class="empty"><b>' + (ui.pack === "mine" ? "No questions of your own yet" : "Nothing marked as needs work") + "</b><span>" + (ui.pack === "mine" ? "Paste the requirements or questions from a job posting and practise each one." : "Practise a few. Anything you stumble on shows up here.") + '</span><button class="btn brown" data-act="' + (ui.pack === "mine" ? "paste-q" : "practice") + '">' + (ui.pack === "mine" ? "Add questions" : "Practise") + "</button></div>" : "") +
      "</div>"
    );
  };
  function answerSheet(q) {
    const a = Object.assign({ mode: q.star ? "star" : "free" }, ws.interview.answers[q.id]);
    const star = a.mode === "star";
    const storyOpts = ws.stories.map((s) => '<option value="' + s.id + '"' + (a.storyId === s.id ? " selected" : "") + ">" + esc(s.title) + "</option>").join("");
    return (
      '<div class="sheet-body" data-answer="' + q.id + '"><p class="question">' + esc(q.q) + "</p>" + (q.tip ? '<p class="tip">' + esc(q.tip) + "</p>" : "") +
      (C.EXAMPLES[q.id] ? '<details class="peek"><summary>See an example answer</summary><div class="out">' + esc(C.EXAMPLES[q.id]) + '</div><small class="muted">It shows the shape. Use your own words and your own experience.</small></details>' : "") +
      '<div class="seg" role="group" aria-label="Answer style"><button type="button" data-act="mode" data-v="free" aria-pressed="' + !star + '">Free text</button><button type="button" data-act="mode" data-v="star" aria-pressed="' + star + '">STAR</button></div>' +
      (star
        ? (ws.stories.length ? '<label class="field" for="a-story"><span>Fill from a story</span><select class="select" id="a-story" data-change="from-story"><option value="">Choose one of your stories…</option>' + storyOpts + "</select></label>" : '<p class="small muted">Tip: write your stories in Stories, then fill STAR answers from them in one tap.</p>') +
          [["s", "Situation", "Where were you and what was going on?"], ["t", "Task", "What did you need to do?"], ["a", "Action", "What did you do? Use I, not we."], ["r", "Result", "What happened? Add a number if you can."]].map(([k, l, ph]) => '<label class="field" for="a-' + k + '"><span>' + l + '</span><textarea class="textarea" id="a-' + k + '" data-ans="' + k + '" rows="' + (k === "a" ? 3 : 2) + '" placeholder="' + ph + '">' + esc(a[k] || "") + "</textarea></label>").join("")
        : '<label class="field" for="a-text"><span>Your answer</span><textarea class="textarea" id="a-text" data-ans="text" rows="9" placeholder="Write it the way you\'d say it out loud.">' + esc(a.text || "") + "</textarea></label>") +
      '<div class="meter" data-meter></div>' +
      '<div class="sheet-foot"><button type="button" class="btn ghost sm" data-act="copy-answer">' + icon("copy") + 'Copy</button><span class="grow"></span><label class="check"><input type="checkbox" data-change="ready"' + (a.ready ? " checked" : "") + "> I can say this without reading</label></div></div>"
    );
  }
  function updateMeter() {
    const host = $("[data-answer]");
    if (!host) return;
    const q = qById(host.dataset.answer);
    const words = C.wordCount(C.answerText(ws.interview.answers[q.id]));
    $("[data-meter]", host).innerHTML = words ? '<span class="mono">' + words + " words · ~" + C.speakTime(words) + ' spoken</span><span class="muted">' + esc(C.lengthHint(q, words)) + "</span>" : '<span class="muted">Aim for about one to two minutes spoken.</span>';
  }
  function openAnswer(id) {
    const q = qById(id);
    if (!q) return;
    openSheet(C.PACKS[q.pack], answerSheet(q));
    updateMeter();
  }

  // Practice: flashcards with a timer. Your own answer stays hidden until you ask for it.
  let timer = null;
  const session = { list: [], i: 0, ok: 0 };
  function practiceCard() {
    const q = session.list[session.i];
    const a = C.answerText(ws.interview.answers[q.id]);
    return '<div class="sheet-body practice"><div class="row between"><span class="eyebrow">Question ' + (session.i + 1) + " of " + session.list.length + '</span><span class="mono small muted">' + esc(C.PACKS[q.pack]) + '</span></div><p class="question">' + esc(q.q) + '</p><div class="timer" data-timer>0:00</div><p class="small muted center-text">Say your answer out loud. Aim for one to two minutes.</p><div class="row center"><button class="btn ghost" data-act="timer">Start timer</button></div>' +
      (a ? '<details class="peek"><summary>Show my answer</summary><div class="out">' + esc(a) + "</div></details>" : '<p class="small muted">You haven\'t written an answer for this one yet. Try it anyway, then write it down.</p>') +
      '<div class="row center"><button class="btn ghost" data-act="practice-mark" data-ok="0">Needs work</button><button class="btn brown" data-act="practice-mark" data-ok="1">Nailed it</button></div></div>';
  }

  // ---------- STORIES ----------
  V.stories = function () {
    const list = ws.stories.slice().sort((a, b) => ((a.date || "") < (b.date || "") ? 1 : -1));
    const used = {};
    for (const a of Object.values(ws.interview.answers)) if (a.storyId) used[a.storyId] = (used[a.storyId] || 0) + 1;
    return (
      '<div class="view">' + head(ws.stories.length + (ws.stories.length === 1 ? " story" : " stories"), "Stories", '<button class="btn brown" data-act="new-story">' + icon("plus") + "Add a story</button>") +
      '<p class="muted">Most interview questions can be answered with the same five to eight stories. Write down real moments: helping a teammate, fixing a mistake, handling a rush, calming a customer, catching a safety problem. Each one becomes a STAR answer and a résumé line.</p>' +
      (list.length
        ? '<div class="grid2">' + list.map((s) => '<article class="ticket"><div class="ticket-head"><b>STORY-' + String(s.n || 0).padStart(3, "0") + "</b><span>" + esc(C.fmtDateY(s.date)) + "</span></div><h3>" + esc(s.title) + "</h3>" + (s.result ? '<p class="small">' + esc(s.result) + "</p>" : "") + (used[s.id] ? '<span class="pill brown" style="justify-self:start">Used in ' + plural(used[s.id], "answer") + "</span>" : "") + '<div class="tear"></div><div class="row"><button class="btn sm ghost" data-act="edit-story" data-id="' + s.id + '">' + icon("edit") + 'Edit</button><button class="btn sm ghost" data-act="bullet" data-id="' + s.id + '">Résumé line</button></div></article>').join("") + "</div>"
        : '<div class="empty"><b>No stories yet</b><span>Think of one shift you\'re proud of. What happened, what did you do, how did it turn out?</span><button class="btn brown" data-act="new-story">Write your first story</button></div>') +
      "</div>"
    );
  };
  function storyForm(s) {
    s = s || { date: t0() };
    return (
      '<form data-form="story" data-id="' + esc(s.id || "") + '">' + field("title", "Name it", s.title, { req: true, ph: "Caught a mislabeled pallet" }) +
      field("action", "What you did", s.action, { area: true, rows: 3, ph: "Start with a verb: helped, trained, fixed, organised…" }) + field("result", "How it turned out", s.result, { area: true, rows: 2, ph: "A number helps, but it's optional." }) +
      '<details class="more"' + (s.situation || s.task ? " open" : "") + '><summary>Add the backstory (optional, makes a stronger STAR answer)</summary><div class="stack">' +
      field("situation", "Situation", s.situation, { area: true, rows: 2, ph: "Where were you, what was going on?" }) + field("task", "Task", s.task, { area: true, rows: 2, ph: "What needed doing?" }) + field("date", "Roughly when", s.date, { type: "date" }) + "</div></details>" +
      foot("story", s.id) + "</form>"
    );
  }

  // ---------- ME ----------
  V.me = function () {
    const p = ws.profile;
    let theme = "system";
    try { theme = localStorage.getItem("careercrumbs:theme") || "system"; } catch (e) {}
    const where = mode === "cloud" ? "Saved to your claude.ai account and private to you." : "Saved in this browser only. Export a backup now and then.";
    return (
      '<div class="view">' + head("Your details and your data", "Me") +
      '<section class="card stack"><h2>About you</h2><form class="stack" data-form="profile">' + field("name", "Your name", p.name, { hint: "Signs your follow-up and thank-you messages." }) + field("targetRole", "Job you're going for", p.targetRole, { ph: "Warehouse associate, cashier, shift lead…" }) +
      '<div class="field"><span>Question sets for your kind of job</span><div class="togglechips">' + ["warehouse", "service", "lead"].map((k) => '<label><input type="checkbox" name="packs" value="' + k + '"' + ((p.packs || []).includes(k) ? " checked" : "") + "><span>" + esc(C.PACKS[k]) + "</span></label>").join("") + "</div><small>Common and behavioral questions are always included.</small></div>" +
      '<div class="row"><button class="btn brown">Save</button></div></form></section>' +
      '<section class="card stack"><h2>Look</h2><div class="chips" role="group" aria-label="Theme">' + [["system", "Match device"], ["light", "Light"], ["dark", "Dark"]].map(([v, l]) => '<button class="chip" data-act="theme" data-v="' + v + '" aria-pressed="' + (theme === v) + '">' + l + "</button>").join("") + "</div></section>" +
      '<section class="card stack"><h2>Your data</h2><p class="muted">' + esc(where) + '</p><div class="row"><button class="btn ghost" data-act="export">Export backup</button><label class="btn ghost" for="import-file">Import backup</label><input class="sr" id="import-file" type="file" accept=".json,application/json"></div><div data-import></div><div class="row divider"><button class="btn danger sm" data-act="ask-erase">Erase everything</button></div><div data-erase></div></section>' +
      '<p class="muted small">CareerCrumbs has no AI and sends your answers nowhere. What you write is yours.</p></div>'
    );
  };

  // ---------- sheets, toasts, files ----------
  function openSheet(title, body) {
    ui.sheetOpen = true;
    const host = $("#sheet");
    host.innerHTML = '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="sheet-grip"></div><div class="sheet-head"><h2>' + esc(title) + '</h2><button class="iconbtn" data-act="close" aria-label="Close">' + icon("close") + "</button></div>" + body + "</div></div>";
    host.hidden = false;
    document.body.style.overflow = "hidden";
  }
  function closeSheet() {
    const host = $("#sheet");
    host.innerHTML = "";
    host.hidden = true;
    document.body.style.overflow = "";
    ui.sheetOpen = false;
    clearInterval(timer);
    render();
  }
  let toastTimer = null;
  function toast(msg, label, fn) {
    const host = $("#toast");
    host.innerHTML = '<div class="toast" role="status"><span>' + esc(msg) + "</span>" + (label ? '<button type="button">' + esc(label) + "</button>" : "") + "</div>";
    host.hidden = false;
    if (label) host.querySelector("button").onclick = () => { host.hidden = true; fn(); };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (host.hidden = true), label ? 7000 : 3200);
  }
  function confirmIn(host, msg, label, fn) {
    host.innerHTML = '<div class="confirm"><p>' + esc(msg) + '</p><button type="button" class="btn sm ghost" data-act="cancel-confirm">Keep</button><button type="button" class="btn sm danger" data-go>' + esc(label) + "</button></div>";
    host.querySelector("[data-go]").onclick = fn;
  }
  async function copyText(text, el) {
    try {
      await navigator.clipboard.writeText(text);
      toast("Copied");
    } catch (e) {
      if (el) { el.focus(); el.select(); }
      toast("Couldn't copy here. The text is selected so you can copy it.");
    }
  }
  async function saveFile(name, data) {
    if (!downloads) return toast("Saving files isn't available here. Use Copy instead.");
    try {
      await downloads.save({ filename: name, data });
      toast("Saved " + name);
    } catch (e) {
      if (!e || e.code !== "declined") toast("Couldn't save the file.");
    }
  }
  function textSheet(title, text, file) {
    openSheet(title, '<div class="sheet-body"><textarea class="textarea mono-text" id="ts" rows="16">' + esc(text) + '</textarea><div class="sheet-foot"><span class="grow"></span>' + (file ? '<button class="btn ghost" data-act="ts-file" data-name="' + esc(file) + '">Save file</button>' : "") + '<button class="btn brown" data-act="ts-copy">' + icon("copy") + "Copy</button></div></div>");
  }
  const slug = (s) => String(s || "job").replace(/\s*\(example\)/, "").replace(/[^\w-]+/g, "-").replace(/^-|-$/g, "").toLowerCase();

  // ---------- actions ----------
  const A = {
    close: () => closeSheet(),
    scrim: (el, ev) => ev.target === el && closeSheet(),
    "cancel-confirm": (el) => (el.closest(".confirm").parentElement.innerHTML = ""),
    "new-job": () => openSheet("Add a job", jobForm()),
    "edit-job": (el) => openSheet("Job", jobForm(byId(ws.jobs, el.dataset.id))),
    "job-filter": (el) => { ui.jobFilter = el.dataset.v; route === "jobs" ? render() : go("jobs"); },
    messages(el) {
      const j = byId(ws.jobs, el.dataset.id);
      const ms = C.messages(j, ws.profile);
      const first = ms.findIndex((m) => m.id === (j.status === "Interview" && j.interviewAt && j.interviewAt.slice(0, 10) <= t0() ? "thanks" : j.status === "Interview" ? "confirm" : "followup"));
      openSheet("Messages · " + j.company, '<div class="sheet-body"><p class="muted small">Ready to copy into an email or text. Fill in anything in [brackets].</p>' + (ws.profile.name ? "" : '<label class="field" for="sign-name"><span>Your name, to sign the message</span><input class="input" id="sign-name" data-change="sign-name" data-id="' + j.id + '" placeholder="First and last name" autocomplete="name"></label>') + '<div class="chips">' + ms.map((m, i) => '<button class="chip" data-act="msg" data-i="' + i + '" data-id="' + j.id + '" aria-pressed="' + (i === first) + '">' + esc(m.label) + "</button>").join("") + '</div><label class="field" for="msg-subject"><span>Subject</span><input class="input" id="msg-subject" value="' + esc(ms[first].subject) + '"></label><label class="field" for="msg-body"><span>Message</span><textarea class="textarea" id="msg-body" rows="11">' + esc(ms[first].body) + '</textarea></label><div class="sheet-foot">' + (j.status === "Interview" ? '<label class="check"><input type="checkbox" data-change="thanked" data-id="' + j.id + '"' + (j.thankYouSent ? " checked" : "") + "> Thank-you sent</label>" : "") + '<span class="grow"></span><button class="btn brown" data-act="msg-copy">' + icon("copy") + "Copy message</button></div></div>");
    },
    msg(el) {
      const m = C.messages(byId(ws.jobs, el.dataset.id), ws.profile)[el.dataset.i];
      el.parentElement.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === el)));
      $("#msg-subject").value = m.subject;
      $("#msg-body").value = m.body;
    },
    "msg-copy": () => copyText($("#msg-subject").value + "\n\n" + $("#msg-body").value, $("#msg-body")),
    prep(el) {
      ui.prepJob = el.dataset.id;
      if (ui.sheetOpen) closeSheet();
      if (route === "interview") render();
      else go("interview");
      window.scrollTo(0, 0);
    },
    unprep() { ui.prepJob = null; render(); },
    cheat(el) {
      const j = byId(ws.jobs, el.dataset.id);
      textSheet("Cheat sheet", C.cheatSheet(ws, j), "cheat-sheet-" + slug(j.company) + ".txt");
    },
    ics(el) {
      const j = byId(ws.jobs, el.dataset.id);
      saveFile("interview-" + slug(j.company) + ".ics", C.interviewIcs(j));
    },
    "ts-copy": () => copyText($("#ts").value, $("#ts")),
    "ts-file": (el) => saveFile(el.dataset.name, $("#ts").value),

    pack: (el) => { ui.pack = el.dataset.v; render(); },
    "kind-done": () => { ws.profile.packsAsked = true; save("profile"); },
    answer: (el) => openAnswer(el.dataset.id),
    mode(el) {
      const host = el.closest("[data-answer]");
      const q = qById(host.dataset.answer);
      const a = Object.assign({}, ws.interview.answers[q.id]);
      const cur = a.mode || (q.star ? "star" : "free");
      if (cur === el.dataset.v) return;
      // Keep the words when switching: STAR joins into free text, free text goes into Action.
      if (el.dataset.v === "free") a.text = a.text || C.answerText(Object.assign({}, a, { mode: "star" }));
      else if (!a.a && a.text) a.a = a.text;
      a.mode = el.dataset.v;
      ws.interview.answers[q.id] = a;
      persist("interview");
      host.outerHTML = answerSheet(q);
      updateMeter();
    },
    "copy-answer": () => copyText(C.answerText(ws.interview.answers[$("[data-answer]").dataset.answer])),
    "add-q"() {
      openSheet("Add questions", '<div class="sheet-body"><p class="muted">Add a question you expect, or paste a list straight from a job posting. Each line becomes a question to practise.</p><div class="row"><button class="btn brown" data-act="paste-q">Paste a list</button></div><form data-form="one-q" class="stack">' + field("q", "Or add one question", "", { req: true, ph: "Are you comfortable lifting 50 lb?" }) + select("jobId", "For a job (optional)", ui.prepJob || "", jobOptions()) + '<div class="row"><button class="btn ghost">Add question</button></div></form></div>');
    },
    "paste-q"(el) {
      const jobId = (el && el.dataset && el.dataset.job) || ui.prepJob || "";
      openSheet("Paste questions", '<form data-form="paste-q"><label class="field" for="f-paste"><span>One per line</span><textarea class="textarea" id="f-paste" name="paste" rows="9" required placeholder="Paste questions or requirements from the posting. A line like &quot;Able to lift 50 lb&quot; becomes &quot;Tell me about: able to lift 50 lb&quot;."></textarea></label>' + select("jobId", "For a job (optional)", jobId, jobOptions()) + '<div class="sheet-foot"><span class="grow"></span><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn brown">Add questions</button></div></form>');
    },
    practice() {
      const job = ui.prepJob ? byId(ws.jobs, ui.prepJob) : null;
      let pool = (job ? C.jobQuestions(ws, job) : C.bankFor(ws, ["mine", "common", "behavioral"].concat(ws.profile.packs || []))).filter((q) => q.pack !== "ask");
      const work = pool.filter((q) => needsWork(q.id));
      pool = work.concat(pool.filter((q) => !work.includes(q)).sort(() => Math.random() - 0.5));
      session.list = pool.slice(0, 5);
      session.i = 0;
      session.ok = 0;
      if (!session.list.length) return toast("Add some questions first.");
      clearInterval(timer);
      openSheet("Practice", practiceCard());
    },
    timer(el) {
      clearInterval(timer);
      let s = 0;
      const out = $("[data-timer]");
      out.textContent = "0:00";
      el.textContent = "Restart";
      timer = setInterval(() => {
        if (!document.body.contains(out)) return clearInterval(timer);
        s++;
        out.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
        out.dataset.state = s > 120 ? "long" : s >= 60 ? "good" : "";
      }, 1000);
    },
    "practice-mark"(el) {
      clearInterval(timer);
      const q = session.list[session.i];
      const ok = el.dataset.ok === "1";
      ws.interview.practice = ws.interview.practice.concat([{ q: q.id, date: t0(), ok }]).slice(-300);
      persist("interview");
      if (ok) session.ok++;
      session.i++;
      const body = $(".sheet .sheet-body");
      if (session.i < session.list.length) body.outerHTML = practiceCard();
      else body.outerHTML = '<div class="sheet-body practice center-text">' + ruhv("ruhv-hero") + "<h2>" + session.ok + " of " + session.list.length + ' nailed</h2><p class="muted">' + (session.ok === session.list.length ? "Great run. Do another set tomorrow to keep it fresh." : "The ones that need work are saved under Needs work. Rewrite them, then practise again.") + '</p><div class="row center"><button class="btn ghost" data-act="close">Done</button><button class="btn brown" data-act="practice">Another 5</button></div></div>';
    },

    "new-story": () => openSheet("Add a story", storyForm()),
    "edit-story": (el) => openSheet("Story", storyForm(byId(ws.stories, el.dataset.id))),
    bullet(el) {
      const s = byId(ws.stories, el.dataset.id);
      openSheet("Résumé line", '<div class="sheet-body"><span class="eyebrow">Template · edit it to sound like you</span><textarea class="textarea" id="ts" rows="4">' + esc(C.bulletFromStory(s)) + '</textarea><p class="small muted">Built only from your own words. Anything in [brackets] is missing: fill it in or delete it.</p><div class="sheet-foot"><span class="grow"></span><button class="btn brown" data-act="ts-copy">' + icon("copy") + "Copy</button></div></div>");
    },

    theme(el) {
      try { localStorage.setItem("careercrumbs:theme", el.dataset.v); } catch (e) {}
      applyTheme();
      render();
    },
    export: () => saveFile("careercrumbs-backup-" + t0() + ".json", JSON.stringify(Object.assign({ app: "CareerCrumbs", version: 2, exported: new Date().toISOString() }, ws), null, 2)),
    "ask-erase"() {
      confirmIn($("[data-erase]"), "This deletes every job, answer and story. Export a backup first if you might want them.", "Erase everything", () => {
        ws = C.emptyWorkspace();
        for (const m of Object.keys(MODULES)) dirty.add(m);
        save();
        toast("Erased");
      });
    },
    "ask-del"(el) {
      const map = { job: ["jobs", "this job"], story: ["stories", "this story"] };
      const [key, what] = map[el.dataset.kind];
      const id = el.dataset.id;
      confirmIn(el.closest(".sheet").querySelector("[data-confirm]"), "Delete " + what + "?", "Delete", () => {
        const idx = ws[key].findIndex((x) => x.id === id);
        const removed = ws[key][idx];
        ws[key] = ws[key].filter((x) => x.id !== id);
        if (key === "jobs" && ui.prepJob === id) ui.prepJob = null;
        closeSheet();
        save(key);
        toast("Deleted", "Undo", () => { ws[key].splice(idx, 0, removed); save(key); });
      });
    },
  };

  // change handlers
  const CH = {
    kind(el) {
      const set = new Set(ws.profile.packs || []);
      el.checked ? set.add(el.value) : set.delete(el.value);
      ws.profile.packs = [...set];
      save("profile");
    },
    "sign-name"(el) {
      ws.profile.name = el.value.trim();
      persist("profile");
      const on = $(".sheet .chip[aria-pressed=true]");
      if (on) A.msg(on);
    },
    "job-status"(el) {
      const i = ws.jobs.findIndex((j) => j.id === el.dataset.id);
      ws.jobs[i] = C.setStatus(ws.jobs[i], el.value);
      if (el.value === "Applied" && !ws.jobs[i].followUpAt) ws.jobs[i].followUpAt = C.addDays(t0(), 7);
      save("jobs");
      if (el.value === "Applied") toast("Follow-up reminder set for a week from today.");
      if (el.value === "Interview") toast("You got the interview. Add the date and time, then prep.", "Add date", () => A["edit-job"]({ dataset: { id: el.dataset.id } }));
      if (el.value === "Offer") toast("Congratulations! You earned this.");
    },
    "pick-ask"(el) {
      ws.interview.answers[el.dataset.id] = Object.assign({}, ws.interview.answers[el.dataset.id], { pick: el.checked });
      persist("interview");
    },
    ready(el) {
      const id = el.closest("[data-answer]").dataset.answer;
      ws.interview.answers[id] = Object.assign({ mode: qById(id).star ? "star" : "free" }, ws.interview.answers[id], { ready: el.checked });
      persist("interview");
      if (el.checked) toast("Marked ready. Say it out loud a couple more times.");
    },
    "from-story"(el) {
      const host = el.closest("[data-answer]");
      const s = byId(ws.stories, el.value);
      if (!s) return;
      const q = qById(host.dataset.answer);
      ws.interview.answers[q.id] = Object.assign({}, ws.interview.answers[q.id], C.storyToStar(s));
      persist("interview");
      host.outerHTML = answerSheet(q);
      updateMeter();
    },
    thanked(el) {
      byId(ws.jobs, el.dataset.id).thankYouSent = el.checked;
      persist("jobs");
    },
  };

  // form handlers
  const val = (f, n) => (f.elements[n] ? String(f.elements[n].value || "").trim() : "");
  const F = {
    job(f) {
      const id = f.dataset.id;
      const data = { title: val(f, "title"), company: val(f, "company"), appliedAt: val(f, "appliedAt"), interviewAt: val(f, "interviewAt"), followUpAt: val(f, "followUpAt"), contact: val(f, "contact"), link: val(f, "link"), notes: val(f, "notes") };
      const status = val(f, "status");
      if (id) {
        const i = ws.jobs.findIndex((j) => j.id === id);
        let j = Object.assign({}, ws.jobs[i], data);
        if (j.status !== status) j = C.setStatus(j, status);
        ws.jobs[i] = j;
      } else {
        const j = C.setStatus(Object.assign({ id: C.uid("j"), created: t0(), history: [] }, data), status);
        if (status === "Applied" && !j.followUpAt) j.followUpAt = C.addDays(j.appliedAt || t0(), 7);
        ws.jobs.push(j);
      }
      closeSheet();
      save("jobs");
    },
    story(f) {
      const id = f.dataset.id;
      const data = { title: val(f, "title"), date: val(f, "date"), situation: val(f, "situation"), task: val(f, "task"), action: val(f, "action"), result: val(f, "result") };
      if (id) Object.assign(byId(ws.stories, id), data);
      else {
        ws.storySeq = (ws.storySeq || 0) + 1;
        ws.stories.push(Object.assign({ id: C.uid("s"), n: ws.storySeq }, data));
      }
      closeSheet();
      save("stories", "storySeq");
      if (!id) toast("Story saved. Use it to fill a STAR answer in Interview.");
    },
    "one-q"(f) {
      ws.interview.custom = ws.interview.custom.concat([{ id: C.uid("q"), q: val(f, "q"), jobId: val(f, "jobId") }]);
      closeSheet();
      if (!ui.prepJob) ui.pack = "mine";
      save("interview");
    },
    "paste-q"(f) {
      const jobId = val(f, "jobId");
      const lines = val(f, "paste").split(/\r?\n/).map((l) => l.replace(/^[\s•*\-–—\d.)]+/, "").trim()).filter((l) => l.length > 3);
      const qs = lines.slice(0, 40).map((l) => ({ id: C.uid("q"), q: /\?$/.test(l) ? l : "Tell me about: " + l.charAt(0).toLowerCase() + l.slice(1).replace(/[.;]$/, ""), jobId }));
      ws.interview.custom = ws.interview.custom.concat(qs);
      closeSheet();
      if (!ui.prepJob) ui.pack = "mine";
      save("interview");
      toast("Added " + plural(qs.length, "question"));
    },
    profile(f) {
      ws.profile.name = val(f, "name");
      ws.profile.targetRole = val(f, "targetRole");
      ws.profile.packs = [...f.querySelectorAll("input[name=packs]:checked")].map((i) => i.value);
      save("profile");
      toast("Saved");
    },
  };

  // ---------- wiring ----------
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-act]");
    if (!el || !A[el.dataset.act]) return;
    if (el.tagName === "A") ev.preventDefault();
    A[el.dataset.act](el, ev);
  });
  document.addEventListener("change", (ev) => {
    const el = ev.target;
    if (el.dataset && el.dataset.change && CH[el.dataset.change]) CH[el.dataset.change](el);
    if (el.id === "import-file" && el.files && el.files[0]) importFile(el.files[0]);
  });
  document.addEventListener("submit", (ev) => {
    const f = ev.target;
    if (!F[f.dataset.form]) return;
    ev.preventDefault();
    F[f.dataset.form](f);
  });
  // Answers save as you type, without redrawing the sheet.
  document.addEventListener("input", (ev) => {
    const el = ev.target;
    if (!el.dataset || !el.dataset.ans) return;
    const q = qById(el.closest("[data-answer]").dataset.answer);
    const a = Object.assign({ mode: q.star ? "star" : "free" }, ws.interview.answers[q.id]);
    a[el.dataset.ans] = el.value;
    a.updated = new Date().toISOString();
    ws.interview.answers[q.id] = a;
    updateMeter();
    persist("interview");
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && ui.sheetOpen) closeSheet(); });

  function importFile(file) {
    const r = new FileReader();
    r.onload = () => {
      let data;
      try { data = JSON.parse(r.result); } catch (e) { return toast("That file isn't a CareerCrumbs backup."); }
      const next = C.normalize(data);
      confirmIn($("[data-import]"), "Replace everything with this backup (" + plural(next.jobs.length, "job") + ", " + plural(Object.keys(next.interview.answers).length, "answer") + ", " + next.stories.length + (next.stories.length === 1 ? " story" : " stories") + ")?", "Replace", () => {
        ws = next;
        for (const m of Object.keys(MODULES)) dirty.add(m);
        save();
        toast("Backup restored");
      });
    };
    r.readAsText(file);
  }
  function applyTheme() {
    let t = "system";
    try { t = localStorage.getItem("careercrumbs:theme") || "system"; } catch (e) {}
    if (t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }

  boot();
})();

</script>
