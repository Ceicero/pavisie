name: pavisie

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pavisie
      POSTGRES_PASSWORD: pavisie
      POSTGRES_DB: pavisie
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pavisie -d pavisie']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pavisie:pavisie@postgres:5432/pavisie
    command: ['pnpm', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  bot:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.bot
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pavisie:pavisie@postgres:5432/pavisie
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3002/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pavisie:pavisie@postgres:5432/pavisie
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dashboard
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      # NEXT_PUBLIC_* vars are inlined into the JS bundle by `next build` itself (both server and client code),
      # so they have to be supplied as build args here, not just container-runtime `environment:` below — by
      # the time the container starts, the values are already baked into the compiled output. `docker compose
      # build` reads these from the shell/`.env` at the repo root (compose auto-loads `./.env` for variable
      # substitution here, same file `env_file:` loads into the running container below).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_DISCORD_CLIENT_ID: ${NEXT_PUBLIC_DISCORD_CLIENT_ID:-}
        NEXT_PUBLIC_INVITE_PERMISSIONS: ${NEXT_PUBLIC_INVITE_PERMISSIONS:-}
        NEXT_PUBLIC_SUPPORT_SERVER_URL: ${NEXT_PUBLIC_SUPPORT_SERVER_URL:-}
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3003:3003'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
